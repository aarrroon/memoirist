<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightstand</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Nightstand: the familiar feed at night. Dark first; the light mode is a lamp-lit morning.
   Signature: the week fan. Loot Drop: an hourglass. Tokens per theme and mode, each designed on its own. */
:root {
  --font-d: "Outfit", system-ui, sans-serif;
  --font-t: "Work Sans", system-ui, sans-serif;
  --r-photo: 16px; --r-card: 20px; --r-tile: 10px;
  --side: 232px; --bar: 64px;
  --page: #161B24; --surface: #1F2633; --raised: #283040; --line: #2C3442;
  --ink: #E7EAF0; --ink2: #A3ADBD; --accent: #93ACFF; --on-accent: #10141C;
  --sand: #EFD9A0; --frame: #A3ADBD; --glass: #5E6A80; --spotify: #1DB954;
  --scrim: rgba(8, 10, 14, .62); --float: 0 18px 48px rgba(0, 0, 0, .45); --floor: rgba(0, 0, 0, .35);
  color-scheme: dark;
}
/* Dusk blue, night: dark blue-grey rather than black, lifted a step from the agreed #11151D */
[data-theme="a"][data-mode="dark"] {
  --page: #161B24; --surface: #1F2633; --raised: #283040; --line: #2C3442;
  --ink: #E7EAF0; --ink2: #A3ADBD; --accent: #93ACFF; --on-accent: #10141C;
  --sand: #EFD9A0; --frame: #A3ADBD; --glass: #6B788F; --spotify: #1DB954;
  --scrim: rgba(6, 8, 12, .76); --float: 0 18px 48px rgba(0, 0, 0, .45); --floor: rgba(0, 0, 0, .35);
  color-scheme: dark;
}
/* Dusk blue, morning: cool paper light, the sand in lamp gold */
[data-theme="a"][data-mode="light"] {
  --page: #F6F7F9; --surface: #FFFFFF; --raised: #EBEEF3; --line: #E3E7EE;
  --ink: #141A26; --ink2: #4A5468; --accent: #2F57C8; --on-accent: #FFFFFF;
  --sand: #7D6512; --sand-fill: #A07F12; --frame: #4A5468; --glass: #7C879B; --spotify: #000000;
  --scrim: rgba(20, 26, 38, .42); --float: 0 18px 44px rgba(20, 26, 38, .18); --floor: rgba(20, 26, 38, .14);
  color-scheme: light;
}
/* Sunset rose, night: warm grey, not plum */
[data-theme="b"][data-mode="dark"] {
  --page: #1C1719; --surface: #262022; --raised: #30292C; --line: #362E31;
  --ink: #F1E9EC; --ink2: #B8ABB1; --accent: #F09DB8; --on-accent: #1A1216;
  --sand: #F09DB8; --frame: #B8ABB1; --glass: #7E7076; --spotify: #1DB954;
  --scrim: rgba(10, 7, 8, .76); --float: 0 18px 48px rgba(0, 0, 0, .45); --floor: rgba(0, 0, 0, .35);
  color-scheme: dark;
}
/* Sunset rose, morning */
[data-theme="b"][data-mode="light"] {
  --page: #F7F4F5; --surface: #FFFFFF; --raised: #EFEAEC; --line: #ECE5E8;
  --ink: #1C1619; --ink2: #5C5157; --accent: #A8325A; --on-accent: #FFFFFF;
  --sand: #A8325A; --frame: #5C5157; --glass: #8E8086; --spotify: #000000;
  --scrim: rgba(28, 22, 25, .42); --float: 0 18px 44px rgba(28, 22, 25, .18); --floor: rgba(28, 22, 25, .14);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.55 var(--font-t); overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.icon { flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Shell ---------- */
.shell { min-height: 100vh; }
.main { padding: 0 16px calc(var(--bar) + 40px); max-width: 640px; margin: 0 auto; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; margin: 0 -16px; padding: 0 16px; background: var(--page); }
.wordmark { font: 600 21px/1 var(--font-d); letter-spacing: -.02em; }
.now { font-size: 14px; font-weight: 400; color: var(--ink2); }
.back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 500; font-size: 15px; }
.quiet-act { min-height: 44px; padding: 0 4px; font-size: 15px; font-weight: 500; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--glass); }
.quiet-act:hover { color: var(--ink); }

.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--bar) + env(safe-area-inset-bottom)); padding: 0 6px env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 52px; font-size: 12px; font-weight: 500; color: var(--ink2); }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .icon { stroke-width: 2.1; }
.write { position: relative; display: flex; justify-content: center; }
.write-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 15px/1 var(--font-t); transition: transform .12s ease, filter .12s ease; }
.write-btn:hover { filter: brightness(1.06); }
.write-btn:active { transform: scale(.97); }
.write-menu:not([hidden]) { position: absolute; z-index: 40; display: grid; min-width: 216px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--float); } /* taste-skill-ignore: the Write menu is a real overlay */
.write-menu button { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 10px; font-size: 15px; font-weight: 500; text-align: left; color: var(--ink); }
.write-menu button .icon { color: var(--ink2); }
.write-menu button:hover { background: var(--raised); }
.tabs .write-menu { bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); }

.side { display: none; }

/* ---------- Feed ---------- */
.otd { padding: 4px 0 16px; }
.otd h2, .rail h2 { font: 500 14px/1.3 var(--font-t); color: var(--ink2); margin-bottom: 8px; }
.otd ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.otd-item { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px 6px 6px; border-radius: 14px; background: var(--surface); }
.otd-item img { flex: none; width: 40px; height: 40px; border-radius: 9px; object-fit: cover; }
.otd-item b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-weight: 500; font-size: 14px; line-height: 1.25; }
.otd-item span span { display: block; font-size: 13px; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
.otd-item > span { min-width: 0; }

.era-bar { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px 8px 8px; margin: 4px 0 6px; border-radius: 16px; background: var(--surface); }
.era-bar .disc { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
.era-bar strong { display: block; font: 600 16px/1.25 var(--font-d); }
.era-bar small { display: block; font-size: 13px; color: var(--ink2); }
.era-bar > span { flex: 1; min-width: 0; }
.era-bar .icon, .week-head > .icon { color: var(--ink2); }

.wk { margin-top: 18px; }
.week { margin: 0 0 6px; }
.week-head { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 4px 6px 2px; cursor: pointer; list-style: none; border-radius: 12px; }
.week-head::-webkit-details-marker { display: none; }
.week-head .icon { transition: transform .2s ease; }
.week[open] .week-head > .icon { transform: rotate(90deg); }
/* The count drops under the title when both don't fit, so a week's name is never cut on a phone */
.wk-text { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; row-gap: 0; }
.wk-title { min-width: 0; max-width: 100%; font: 600 17px/1.2 var(--font-d); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-count { flex: none; font-size: 14px; color: var(--ink2); }
.week-sum { margin: 2px 0 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); font-size: 15px; display: grid; gap: 10px; }

/* The week fan: up to three overlapping thumbnails from the week's open entries */
.fan { position: relative; flex: none; width: 60px; height: 52px; }
.fan > * { position: absolute; top: 4px; width: 34px; height: 44px; border-radius: 7px; object-fit: cover; border: 2px solid var(--page); background: var(--raised); transform-origin: 50% 100%; }
.fan > :nth-child(1) { left: 1px; transform: rotate(-11deg); }
.fan > :nth-child(2) { left: 13px; transform: rotate(-1deg); }
.fan > :nth-child(3) { left: 24px; transform: rotate(9deg); }
.fan-1 > :nth-child(1) { left: 13px; transform: rotate(-4deg); }
.fan-2 > :nth-child(1) { left: 6px; }
.fan-2 > :nth-child(2) { left: 20px; transform: rotate(7deg); }
.fan .blank { display: block; background: var(--page); border: 1.5px solid var(--glass); }

.entries { display: grid; gap: 30px; }
.day { font-size: 14px; color: var(--ink2); margin: 0 0 8px 2px; }
.card .ph { display: block; border-radius: var(--r-photo); overflow: hidden; background: var(--raised); aspect-ratio: 4 / 3; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; }
.card .ph.page { aspect-ratio: 4 / 3; }
.card-title { font: 600 21px/1.25 var(--font-d); letter-spacing: -.01em; margin: 12px 2px 4px; }
.card-title.label { color: var(--ink2); font-weight: 500; font-size: 18px; }
.card .lede { margin: 12px 2px 4px; font-size: 17px; line-height: 1.5; }
.cap { margin: 0 2px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; color: var(--ink); }
.cap h3 { font: 600 15px/1.4 var(--font-d); color: var(--ink2); display: inline; margin-right: 6px; }
.cap p { display: inline; }
.cap p + p::before { content: " "; }
.cap ul { display: inline; }
.card.note { padding: 18px 18px 16px; border-radius: var(--r-card); background: var(--surface); }
.card.note .card-title { margin-top: 0; }
.card.note .cap { -webkit-line-clamp: 5; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 12px 2px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: var(--raised); font-size: 13px; font-weight: 500; color: var(--ink); }
.meta .count { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink2); }
.voice { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 14px 4px 4px; border-radius: 999px; background: var(--raised); }
.voice .play { position: relative; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink2); color: var(--ink); }
/* Small controls keep their look but get a 44px hit area */
.voice .play::after, button.chip::after { content: ""; position: absolute; inset: -4px; }
button.chip { position: relative; }
button.chip::after { inset: -7px -2px; }
.voice .wave { color: var(--ink2); }
.voice .dur { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.song { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
.song .icon { color: var(--spotify); }
.song span { color: var(--ink2); }

/* The sealed card: one fixed size, only the memory date, the opening date and the countdown */
.sealed { height: 124px; border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.sealed > a { display: flex; align-items: center; gap: 18px; height: 100%; padding: 0 22px 0 18px; border-radius: var(--r-card); }
.sealed > a:focus-visible { outline-offset: -3px; }
.sealed .s-mem, .sealed .s-open, .sealed .s-count { display: block; }
.sealed .hg { width: 52px; height: 84px; flex: none; }
.sealed .s-mem { font-size: 14px; color: var(--ink2); }
.sealed .s-open { font: 600 17px/1.3 var(--font-d); margin-top: 2px; }
.sealed .s-count { font: 500 15px/1.3 var(--font-t); color: var(--sand); margin-top: 4px; }

.rail { display: none; }

/* ---------- Hourglass ---------- */
.hg .cap-plate, .hg .post { fill: var(--frame); }
.hg .glass { fill: var(--raised); stroke: var(--glass); stroke-width: 2.4; }
.hg .sand { fill: var(--sand-fill, var(--sand)); }
.hg .stream { stroke: var(--sand-fill, var(--sand)); stroke-width: 1.6; stroke-linecap: round; }
.hg .glint { stroke: #FFFFFF; stroke-width: 2.2; stroke-linecap: round; fill: none; opacity: .35; }
.hg .floor { fill: var(--floor); }
.hg .grain { fill: var(--sand-fill, var(--sand)); opacity: 0; animation: fall 3.6s linear infinite; }
.hg .grain:nth-of-type(2) { animation-delay: 1.2s; }
.hg .grain:nth-of-type(3) { animation-delay: 2.4s; }
@keyframes fall { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(58px); opacity: 0; } }

/* ---------- Entry ---------- */
.entry-head .date { font-size: 15px; color: var(--ink2); margin-top: 20px; }
.entry-head h1 { font: 600 24px/1.2 var(--font-d); letter-spacing: -.02em; margin: 4px 0 18px; }
.media .main-photo { width: 100%; height: auto; border-radius: var(--r-photo); }
.thumbs { display: flex; gap: 8px; margin-top: 10px; }
.thumbs button { width: 56px; height: 56px; border-radius: var(--r-tile); overflow: hidden; padding: 0; border: 2px solid transparent; }
.thumbs button[aria-pressed="true"] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.prose { margin-top: 22px; font-size: 17px; line-height: 1.6; max-width: 62ch; }
.prose h3 { font: 600 15px/1.4 var(--font-d); color: var(--ink2); margin: 20px 0 4px; }
.prose h3:first-child { margin-top: 0; }
.prose p + p { margin-top: 12px; }
.prose ul { padding-left: 22px; list-style: disc; margin: 6px 0 10px; }
.prose li + li { margin-top: 4px; }
.extras { display: grid; gap: 14px; margin-top: 24px; justify-items: start; }
.track { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px 8px 10px; border-radius: 16px; background: var(--surface); }
.track .icon { color: var(--spotify); }
.track b { display: block; font-weight: 500; font-size: 15px; line-height: 1.3; }
.track small { display: block; font-size: 13px; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Era ---------- */
.era-cover { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: var(--r-photo); }
.era-info h1 { font: 600 24px/1.2 var(--font-d); letter-spacing: -.02em; margin: 18px 0 4px; }
.era-info .dates { font-size: 15px; color: var(--ink2); }
.era-info .desc { margin-top: 12px; font-size: 17px; }
.era-info .track { margin-top: 16px; display: inline-flex; }
.totals { display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; border-radius: 16px; background: var(--surface); overflow: hidden; }
.totals div { padding: 14px 16px; }
.totals div:nth-child(odd) { border-right: 1px solid var(--line); }
.totals div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
.totals b { display: block; font: 600 22px/1.2 var(--font-d); font-variant-numeric: tabular-nums; }
.totals span { font-size: 13px; color: var(--ink2); }
.era-sec h2 { font: 600 19px/1.3 var(--font-d); margin: 32px 0 8px; }
.wrows li + li { border-top: 1px solid var(--line); }
.wrow { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 8px 2px; }
.wrow > .wtxt { flex: 1; min-width: 0; }
.wrow b { display: block; font: 600 16px/1.3 var(--font-d); }
.wrow small { display: block; font-size: 14px; color: var(--ink2); }
.wrow .icon { color: var(--ink2); }
.wrow.rest { color: var(--ink2); }
.inside { display: grid; gap: 10px; }
.inside a { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 14px 8px 8px; border-radius: 16px; background: var(--surface); }
.inside .disc { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; display: grid; place-items: center; background: var(--raised); font: 600 18px/1 var(--font-d); color: var(--ink); }
.inside b { display: block; font: 600 16px/1.3 var(--font-d); }
.inside small { display: block; font-size: 14px; color: var(--ink2); }
.inside a > span { flex: 1; }

/* ---------- Loot Drop ---------- */
.loot { margin-top: 8px; padding: 32px 22px 26px; border-radius: 24px; background: var(--surface); text-align: center; }
.loot .hg { width: 150px; height: 220px; margin: 0 auto 10px; display: block; }
.loot h1 { font: 500 16px/1.3 var(--font-t); color: var(--ink2); }
.loot .countdown { font: 600 40px/1.1 var(--font-d); letter-spacing: -.02em; color: var(--sand); margin: 6px 0 8px; }
.loot .opens { font: 500 18px/1.4 var(--font-d); max-width: 30ch; margin: 0 auto; }
.loot .opens .nw { white-space: nowrap; }
.loot .note { font-size: 15px; color: var(--ink2); margin: 14px auto 0; max-width: 34ch; }
.loot .acts { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 24px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(.97); }
.btn-fill { background: var(--accent); color: var(--on-accent); }
.btn-fill:hover { filter: brightness(1.06); }
.btn-soft { background: var(--raised); color: var(--ink); }

/* ---------- Write ---------- */
html[data-screen="write"] body { overflow: hidden; }
.sheet-wrap { position: fixed; inset: 0; z-index: 60; }
.sheet-scrim { display: none; }
.sheet { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--page); }
.sheet-head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-height: 60px; padding: 8px 12px 8px 8px; background: var(--page); border-bottom: 1px solid var(--line); }
.sheet-head .cancel { min-height: 44px; padding: 0 10px; font-weight: 500; color: var(--ink2); }
.sheet-head .cancel:hover { color: var(--ink); }
.sheet-head .ttl { text-align: center; line-height: 1.25; }
.sheet-head h1 { font: 600 16px/1.3 var(--font-d); }
.sheet-head .saved { font-size: 12px; color: var(--ink2); }
.sheet-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
.w-row { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 12px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 500; }
.pick .icon { color: var(--ink2); }
.pick small { color: var(--ink2); font-size: 14px; font-weight: 400; }
.w-title { width: 100%; margin: 16px 0 6px; padding: 6px 2px; border: 0; background: none; color: var(--ink); font: 600 24px/1.25 var(--font-d); letter-spacing: -.01em; border-radius: 6px; }
.w-title::placeholder { color: var(--ink2); }
.fmt { position: sticky; top: -14px; z-index: 2; display: flex; gap: 2px; padding: 4px; margin: 6px 0 10px; width: max-content; border-radius: 12px; background: var(--surface); }
.fmt button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 8px; font: 600 16px/1 var(--font-t); color: var(--ink2); }
.fmt button:hover { background: var(--raised); color: var(--ink); }
.fmt .i { font-style: italic; font-weight: 500; font-family: Georgia, serif; }
.editor { min-height: 180px; padding: 2px 2px 6px; margin-top: 0; }
.editor:focus-visible { outline-offset: 6px; }
.w-sec { margin-top: 22px; }
.w-sec > h2 { font: 500 14px/1.3 var(--font-t); color: var(--ink2); margin-bottom: 8px; }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.strip img, .strip .add { width: 88px; height: 88px; border-radius: 12px; object-fit: cover; flex: none; }
.strip .add { display: grid; place-items: center; align-content: center; gap: 2px; border: 1.5px dashed var(--glass); color: var(--ink2); font-size: 13px; font-weight: 500; }
.seal { margin-top: 26px; padding: 16px; border-radius: 20px; background: var(--surface); }
.seal-head { display: flex; align-items: center; gap: 12px; min-height: 44px; width: 100%; text-align: left; }
.seal-head .hg { width: 22px; height: 34px; flex: none; }
.seal-head b { flex: 1; font: 600 17px/1.3 var(--font-d); }
.seal-head .icon { color: var(--ink2); transform: rotate(90deg); }
.quick { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
.quick button { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; background: var(--raised); text-align: left; }
.quick b { font-weight: 600; font-size: 14px; line-height: 1.3; }
.quick small { font-size: 13px; color: var(--ink2); line-height: 1.3; }
.seal p { margin-top: 12px; font-size: 14px; color: var(--ink2); }

/* ---------- Tablet and laptop ---------- */
@media (min-width: 760px) {
  .tabs, .topbar .wordmark { display: none; }
  .side { display: flex; flex-direction: column; position: fixed; z-index: 20; inset: 0 auto 0 0; width: var(--side); padding: 22px 16px 20px; background: var(--page); border-right: 1px solid var(--line); }
  .side .wordmark { padding: 6px 10px 22px; }
  .side .write-btn { width: 100%; min-height: 46px; }
  .side .write { margin-bottom: 18px; }
  .side .write-menu { top: calc(100% + 8px); left: 0; right: 0; }
  .side nav { display: grid; gap: 2px; }
  .side-link { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--ink2); text-align: left; width: 100%; }
  .side-link:hover { background: var(--surface); color: var(--ink); }
  .side-link[aria-current="page"] { background: var(--surface); color: var(--ink); }
  .side .foot { margin-top: auto; }
  .main { margin-left: var(--side); max-width: none; padding: 0 40px 80px; }
  .main > .col, .main > .feed-grid { max-width: 640px; margin: 0 auto; }
  .topbar { position: static; margin: 0; padding: 0; height: 72px; }
  .topbar.home { height: 88px; align-items: flex-end; padding-bottom: 12px; }
  .now { font: 600 24px/1.2 var(--font-d); color: var(--ink); letter-spacing: -.01em; }
  .entry-head h1, .era-info h1 { font-size: 30px; }
  .sheet-wrap { display: grid; place-items: center; padding: 32px; }
  .sheet-scrim { display: block; position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: relative; inset: auto; width: min(720px, 100%); max-height: calc(100vh - 64px); border-radius: 24px; background: var(--page); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0, 0, 0, .06); overflow: hidden; } /* taste-skill-ignore: the Write dialog is a real overlay */
  .sheet-head { padding: 10px 16px 10px 12px; }
  [data-mode="dark"] .sheet { border-color: var(--glass); }
  .sheet-body { padding: 18px 28px 32px; }
}
@media (min-width: 1100px) {
  .main > .feed-grid { max-width: 1000px; display: grid; grid-template-columns: minmax(0, 600px) 320px; gap: 56px; justify-content: center; }
  .ph-only { display: none; }
  .rail { display: block; position: sticky; top: 0; align-self: start; padding-top: 34px; }
  .rail section + section { margin-top: 28px; }
  .rail .otd-list { grid-template-columns: 1fr; }
  .rail .otd-item { width: auto; }
  .rail-era { display: block; border-radius: 20px; background: var(--surface); overflow: hidden; }
  .rail-era img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .rail-era div { padding: 14px 16px 16px; }
  .rail-era b { display: block; font: 600 18px/1.25 var(--font-d); }
  .rail-era small { display: block; font-size: 14px; color: var(--ink2); }
  .rail-era p { margin-top: 8px; font-size: 15px; }

  .main > .entry-grid { max-width: 1120px; margin: 0 auto; min-height: calc(100vh - 152px); align-content: center; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; align-items: start; }
  .entry-grid .media .main-photo { max-height: 62vh; width: auto; max-width: 100%; }
  .entry-grid .entry-head .date { margin-top: 4px; }
  .entry-grid .prose { margin-top: 0; }

  .main > .era-grid { max-width: 1120px; margin: 0 auto; }
  .era-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; }
  .era-top .era-info h1 { margin-top: 0; font-size: 32px; }
  .totals { grid-template-columns: repeat(4, 1fr); }
  .totals div:nth-child(odd) { border-right: 0; }
  .totals div:nth-child(-n+2) { border-bottom: 0; }
  .totals div + div { border-left: 1px solid var(--line); }
  .era-bottom { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 56px; align-items: start; }

  .sheet-wrap { padding-left: calc(var(--side) + 32px); }
  .sheet { width: min(1000px, 100%); }
  .sheet-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; align-items: start; }
  .w-aside > .w-sec:first-child { margin-top: 4px; }
  .w-aside .seal { margin-top: 22px; }
  .main > .loot-wrap { max-width: 920px; margin: 0 auto; min-height: calc(100vh - 80px); display: flex; flex-direction: column; }
  .loot-wrap > .loot { margin: auto 0; }
  .loot { display: grid; grid-template-columns: 280px minmax(0, 400px); justify-content: center; align-items: center; gap: 48px; padding: 64px; text-align: left; }
  .loot .hg { width: 220px; height: 323px; margin: 0 auto; }
  .loot .countdown { font-size: 40px; }
  .loot .opens, .loot .note { margin-left: 0; max-width: 34ch; }
  .loot .acts { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .hg .grain { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../../shared/content.js"></script>
<script src="../../shared/helpers.js"></script>
<script>
(function () {
  const { html, icon } = M;
  const D = M.data;
  const NOW_LINE = `${M.instant(D.now, { weekday: 'long' })}, ${M.time(D.now)}`; // Wednesday, 7:42 pm
  const plural = (n, one, many = `${one}s`) => `${n.toLocaleString('en-AU')} ${n === 1 ? one : many}`;
  const app = document.getElementById('app');

  // ---------- The hourglass (the Loot Drop's waiting object) ----------
  // Sand mostly still in the top bulb, a thin stream, the bottom just covered: the part of the wait that has passed.
  let hgCount = 0;
  function hourglass({ cls = 'hg', grains = false, floor = false, label = null, passed = 0 } = {}) {
    const id = `hg${++hgCount}`;
    const level = 34 + Math.round(passed * 50); // top sand surface; 34 is a full top bulb
    const heap = 3 + Math.round(passed * 40);   // bottom heap height
    const a11y = label ? `role="img" aria-label="${M.esc(label)}"` : 'aria-hidden="true"';
    return M.raw(`<svg class="${cls}" viewBox="0 0 120 184" ${a11y}>
      <defs>
        <clipPath id="${id}t"><path d="M33 20H87C87 52 68 72 62 90H58C52 72 33 52 33 20Z"/></clipPath>
        <clipPath id="${id}b"><path d="M58 90H62C68 108 87 128 87 160H33C33 128 52 108 58 90Z"/></clipPath>
      </defs>
      ${floor ? '<ellipse class="floor" cx="60" cy="178" rx="50" ry="4.5"/>' : ''}
      <path class="glass" d="M33 20H87C87 52 68 72 62 90C68 108 87 128 87 160H33C33 128 52 108 58 90C52 72 33 52 33 20Z"/>
      <g clip-path="url(#${id}t)"><path class="sand" d="M20 ${level}Q60 ${level + 7} 100 ${level}V96H20Z"/></g>
      <line class="stream" x1="60" y1="88" x2="60" y2="${160 - heap + 1}"/>
      <g clip-path="url(#${id}b)"><path class="sand" d="M20 161L20 160Q44 160 60 ${160 - heap}Q76 160 100 160V161Z"/><rect class="sand" x="20" y="158.5" width="80" height="3"/></g>
      ${grains ? `<g><circle class="grain" cx="60" cy="94" r="1.7"/><circle class="grain" cx="60" cy="94" r="1.5"/><circle class="grain" cx="60" cy="94" r="1.7"/></g>` : ''}
      <path class="glint" d="M40 28C41 44 47 56 53 66"/>
      <rect class="post" x="19" y="18" width="5" height="144" rx="2"/><rect class="post" x="96" y="18" width="5" height="144" rx="2"/>
      <rect class="cap-plate" x="10" y="8" width="100" height="13" rx="5"/><rect class="cap-plate" x="10" y="159" width="100" height="13" rx="5"/>
    </svg>`);
  }
  // How much of the wait has passed, from the sealed view only (memory date to opening day).
  function passedOf(v) {
    const day = (d) => Date.parse(`${d}T00:00:00Z`);
    return (day(M.today()) - day(v.memoryDate)) / (day(v.unlockDay) - day(v.memoryDate));
  }

  // ---------- Small parts ----------
  function waveform(id, n = 34) {
    const hs = M.waveform(id, n);
    return M.raw(`<svg class="wave" width="${n * 3}" height="24" viewBox="0 0 ${n * 3} 24" aria-hidden="true">${hs.map((h, i) => `<rect x="${i * 3}" y="${(12 - h * 11).toFixed(1)}" width="2" height="${(h * 22).toFixed(1)}" rx="1" fill="currentColor"/>`).join('')}</svg>`);
  }
  const voice = (m, n) => html`<span class="voice"><button class="play" type="button" aria-label="Play voice note, ${M.duration(m.durationSeconds)}">${icon('play', { size: 16 })}</button>${waveform(m.id, n)}<span class="dur">${M.duration(m.durationSeconds)}</span></span>`;
  const tagChips = (tags) => html`<ul class="chips" aria-label="Tags">${tags.map((t) => html`<li class="chip">${t.name}</li>`)}</ul>`;
  const track = (s) => html`<div class="track">${icon('spotify', { size: 26, label: 'Spotify' })}<span><b>${s.title}</b><small>${s.artist}</small></span></div>`;

  // Up to three thumbnails for a week: the first photo of each open entry, spread across the week. Never sealed.
  function fanPicks(entries) {
    const firsts = entries.filter((e) => !M.isSealed(e)).map((e) => M.images(e)[0]).filter(Boolean);
    if (firsts.length <= 3) return firsts;
    const n = firsts.length;
    return [0, Math.floor((n - 1) / 2), n - 1].map((i) => firsts[i]);
  }
  function fan(ms, count = ms.length, size = '') {
    const n = Math.max(1, Math.min(3, Math.max(ms.length, count)));
    const tiles = Array.from({ length: n }, (_, i) => (ms[i] ? html`<img src="${M.src(ms[i])}" alt="">` : html`<span class="blank"></span>`));
    return html`<span class="fan fan-${n} ${size}" aria-hidden="true">${tiles}</span>`;
  }

  // ---------- Navigation ----------
  const NAV = [['home', 'Home', '#feed'], ['list', 'Timeline', null], ['layers', 'Eras', '#era'], ['user', 'You', null]];
  const navItem = (cls, [ic, label, href], active) => (href
    ? html`<a class="${cls}" href="${href}" ${active === label ? M.raw('aria-current="page"') : ''}>${icon(ic, { size: 22 })}<span>${label}</span></a>`
    : html`<button class="${cls}" type="button">${icon(ic, { size: 22 })}<span>${label}</span></button>`);
  function side(active) {
    return html`<aside class="side" aria-label="Main">
      <span class="wordmark">memoirist</span>
      ${M.writeMenu({ cls: 'write--side' })}
      <nav>${NAV.map((n) => navItem('side-link', n, active))}</nav>
      <div class="foot"><button class="side-link" type="button">${icon('trash', { size: 20 })}<span>Recently deleted</span></button></div>
    </aside>`;
  }
  function tabs(active) {
    return html`<nav class="tabs" aria-label="Main">
      ${navItem('tab', NAV[0], active)}${navItem('tab', NAV[1], active)}
      ${M.writeMenu({ cls: 'write--tab' })}
      ${navItem('tab', NAV[2], active)}${navItem('tab', NAV[3], active)}
    </nav>`;
  }
  const shell = (active, body, extra = '') => html`<div class="shell">${side(active)}<main class="main">${body}</main>${tabs(active)}</div>${extra}`;

  // ---------- Feed ----------
  function onThisDay(cls) {
    return html`<section class="otd ${cls}" aria-labelledby="otd-${cls}"><h2 id="otd-${cls}">On this day</h2>
      <ul class="otd-list">${D.onThisDay.map((e) => html`<li><a class="otd-item" href="#feed">
        <img src="${M.src(M.images(e)[0])}" alt="${M.images(e)[0].alt}"><span><b>${M.displayTitle(e)}</b><span>${M.yearsAgo(e.entryDate)}</span></span></a></li>`)}</ul></section>`;
  }
  function eraBar(era, cls = '') {
    return html`<a class="era-bar ${cls}" href="#era">${era.cover ? html`<img class="disc" src="${M.cover(era)}" alt="">` : ''}
      <span><strong>${era.title}</strong><small>${M.range(era.startDate, era.endDate)}</small></span>${icon('chevronRight', { size: 20 })}</a>`;
  }
  function weekHead(w) {
    const s = M.weekStats(w);
    const facts = [s.photoCount && plural(s.photoCount, 'photo'), s.voiceNoteCount && plural(s.voiceNoteCount, 'voice note')].filter(Boolean).join(' and ');
    return html`<details class="week"><summary class="week-head">${fan(fanPicks(w.entries))}
        <span class="wk-text"><span class="wk-title">${M.weekLabel(w)}</span><span class="wk-count">${plural(s.entryCount, 'entry', 'entries')}</span></span>${icon('chevronRight', { size: 20 })}</summary>
      <div class="week-sum"><p>${M.range(w.startDate, w.endDate)}${facts ? `: ${facts}` : ''}.</p>${tagChips(s.tags.map((t) => ({ name: t.name })))}</div></details>`;
  }
  function sealedCard(v) {
    const year = v.unlockDay.slice(0, 4);
    return html`<article class="sealed" data-sealed aria-label="Loot Drop, sealed"><a href="#loot">
      ${hourglass({ passed: passedOf(v) })}
      <span><span class="s-mem">${M.date(v.memoryDate, 'dayLong')}</span><span class="s-open">Opens ${M.date(v.unlockDay, 'day')} ${year}</span><span class="s-count">${v.countdown}</span></span></a></article>`;
  }
  function card(e, showDay) {
    const imgs = M.images(e);
    const vn = M.voiceNotes(e)[0];
    const day = showDay ? html`<p class="day">${M.date(e.entryDate, 'dayLong')}</p>` : '';
    const photo = imgs[0] ? html`<a class="ph" href="#entry" tabindex="-1" aria-hidden="true"><img src="${M.src(imgs[0])}" alt="${imgs[0].alt}"></a>` : '';
    let head;
    if (e.title) head = html`<h3 class="card-title"><a href="#entry">${e.title}</a></h3>${e.contentJson ? html`<div class="cap">${M.caption(e.contentJson)}</div>` : ''}`;
    else if (e.contentJson) head = html`<p class="lede"><a href="#entry">${M.previewLine(e)}</a></p>`;
    else head = html`<h3 class="card-title label"><a href="#entry">${M.displayTitle(e)}</a></h3>`;
    const meta = [
      vn && voice(vn, 26),
      imgs.length > 1 && html`<span class="count">${icon('image', { size: 16 })}${plural(imgs.length, 'photo')}</span>`,
      e.soundtrack && html`<span class="song">${icon('spotify', { size: 16, label: 'Spotify' })}${e.soundtrack.title}<span>${e.soundtrack.artist}</span></span>`,
      ...e.tags.map((t) => html`<span class="chip">${t.name}</span>`),
    ].filter(Boolean);
    const body = html`${photo}${head}${meta.length ? html`<div class="meta">${meta}</div>` : ''}`;
    return html`${day}<article class="card ${imgs.length ? '' : 'note'}" data-entry="${e.id}">${body}</article>`;
  }
  function entriesOf(w) {
    let prev = null;
    return w.entries.map((e) => {
      const show = e.entryDate !== prev;
      prev = e.entryDate;
      if (M.isSealed(e)) return html`<div>${sealedCard(M.sealedView(e))}</div>`;
      return html`<div>${card(e, show)}</div>`;
    });
  }
  function feedColumn() {
    return M.feedGroups().map((g, gi) => html`
      ${g.era ? eraBar(g.era, gi === 0 ? 'ph-only' : '') : ''}
      ${g.weeks.map((w) => html`<section class="wk" aria-label="${M.weekLabel(w)}">${weekHead(w)}<div class="entries">${entriesOf(w)}</div></section>`)}`);
  }
  function rail() {
    const era = M.featured.era();
    return html`<aside class="rail" aria-label="On this day and the current Era">
      ${onThisDay('in-rail')}
      <section aria-labelledby="rail-era"><h2 id="rail-era">Current Era</h2>
        <a class="rail-era" href="#era"><img src="${M.cover(era)}" alt=""><div><b>${era.title}</b><small>${M.range(era.startDate, era.endDate)}, ${M.span(era.startDate, era.endDate)}</small><p>${era.description}</p></div></a></section>
    </aside>`;
  }
  function feedBody(behind = false) {
    return html`<div class="feed-grid"><div class="feed-col"><header class="topbar home"><span class="wordmark" aria-hidden="true">memoirist</span>${behind ? html`<p class="now">${NOW_LINE}</p>` : html`<h1 class="now">${NOW_LINE}</h1>`}</header>${onThisDay('ph-only')}${feedColumn()}</div>${rail()}</div>`;
  }

  // ---------- Entry ----------
  function entryBody() {
    const e = M.featured.entry();
    const w = M.weekOf(e.id);
    const imgs = M.images(e);
    return html`<header class="topbar"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}${M.weekLabel(w)}</a><button class="quiet-act" type="button">Edit</button></header>
      <div class="entry-grid">
        <div class="media">
          <img class="main-photo" src="${M.src(imgs[0])}" alt="${imgs[0].alt}">
          <div class="thumbs" role="group" aria-label="Photos">${imgs.map((m, i) => html`<button type="button" aria-pressed="${i === 0}" aria-label="Photo ${i + 1} of ${imgs.length}"><img src="${M.src(m)}" alt=""></button>`)}</div>
        </div>
        <div class="entry-text">
          <div class="entry-head"><p class="date">${M.date(e.entryDate, 'long')}</p><h1>${e.title}</h1></div>
          <div class="prose">${M.caption(e.contentJson)}</div>
          <div class="extras">${M.voiceNotes(e).map((m) => voice(m, 40))}${track(e.soundtrack)}${tagChips(e.tags)}</div>
        </div>
      </div>`;
  }

  // ---------- Era ----------
  function eraBody() {
    const p = M.eraPage(M.data.featured.eraId);
    const e = p.era;
    const t = p.totals;
    const rows = p.rows.map((r) => {
      const wk = D.weeks.find((x) => x.id === r.id);
      const picks = wk ? fanPicks(wk.entries.filter((x) => x.entryDate >= e.startDate)) : [];
      const facts = [plural(r.entryCount, 'entry', 'entries'), r.photoCount && plural(r.photoCount, 'photo'), r.voiceNoteCount && plural(r.voiceNoteCount, 'voice note')].filter(Boolean).join(', ');
      const rng = M.range(r.startDate, r.endDate);
      return html`<li><a class="wrow" href="#feed">${fan(picks, picks.length || r.entryCount)}<span class="wtxt"><b>${r.title}</b><small>${r.title === rng ? facts : `${rng}, ${facts}`}</small></span>${icon('chevronRight', { size: 18 })}</a></li>`;
    });
    const rest = html`<li><div class="wrow rest"><span class="wtxt"><small>${plural(p.notListedWeeks, 'earlier week')}, ${plural(D.eraPages[e.id].notListed.entryCount, 'entry', 'entries')}</small></span></div></li>`;
    return html`<header class="topbar"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}Eras</a><button class="quiet-act" type="button">Edit</button></header>
      <div class="era-grid">
        <div class="era-top"><img class="era-cover" src="${M.cover(e)}" alt="A row of Victorian terrace houses with iron lace verandahs">
          <div class="era-info"><h1>${e.title}</h1><p class="dates">${M.range(e.startDate, e.endDate)}, ${p.span}</p><p class="desc">${e.description}</p>
            ${track(e.soundtrack)}
            <div class="totals num"><div><b>${t.weekCount.toLocaleString('en-AU')}</b><span>weeks</span></div><div><b>${t.entryCount.toLocaleString('en-AU')}</b><span>entries</span></div><div><b>${t.photoCount.toLocaleString('en-AU')}</b><span>photos</span></div><div><b>${t.voiceNoteCount.toLocaleString('en-AU')}</b><span>voice notes</span></div></div>
          </div></div>
        <div class="era-bottom">
          <section class="era-sec" aria-labelledby="wk-h"><h2 id="wk-h">Weeks</h2><ul class="wrows">${rows}${rest}</ul></section>
          <section class="era-sec" aria-labelledby="in-h"><h2 id="in-h">Eras inside this one</h2><div class="inside">${p.chaptersInside.map((c) => html`<a href="#era">${c.cover ? html`<img class="disc" src="${M.cover(c)}" alt="">` : html`<span class="disc" aria-hidden="true">${c.title[0]}</span>`}<span><b>${c.title}</b><small>${M.range(c.startDate, c.endDate)}</small></span>${icon('chevronRight', { size: 18 })}</a>`)}</div></section>
        </div>
      </div>`;
  }

  // ---------- Loot Drop ----------
  // Keeps the date and the time each on one line, so a phone breaks before "at 9:00 am", never inside the date.
  function opensLine(text) {
    const i = text.lastIndexOf(' at ');
    return i < 0 ? text : html`<span class="nw">${text.slice(0, i)}</span> <span class="nw">${text.slice(i + 1)}</span>`;
  }
  function lootBody() {
    const v = M.sealedView(M.featured.lootDrop());
    const w = M.weekOf(v.id);
    return html`<div class="loot-wrap"><header class="topbar"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}${M.weekLabel(w)}</a></header>
      <section class="loot" aria-labelledby="loot-h">
        ${hourglass({ grains: true, floor: true, passed: passedOf(v), label: 'An hourglass with almost all of its sand still in the top' })}
        <div><h1 id="loot-h">Sealed Loot Drop</h1>
          <p class="countdown">${v.countdown}</p>
          <p class="opens">${opensLine(v.opens)}</p>
          <p class="note">Written ${M.date(v.memoryDate, 'long')}. Nobody can open or change it before then, you included.</p>
          <div class="acts"><button class="btn btn-fill" type="button">${icon('clock', { size: 18 })}Extend the seal</button><button class="quiet-act" type="button">Delete</button></div>
        </div></section></div>`;
  }

  // ---------- Write ----------
  function writeSheet() {
    const d = M.draft();
    const e = d.entry;
    const tpl = M.template(e.templateId);
    const imgs = M.images(e);
    const vn = M.voiceNotes(e)[0];
    return html`<div class="sheet-wrap"><div class="sheet-scrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="w-h">
        <div class="sheet-head"><button class="cancel" type="button">Cancel</button>
          <div class="ttl"><h1 id="w-h">New entry</h1><p class="saved">Draft saved ${M.time(d.savedAt)}</p></div>
          <button class="btn btn-fill" type="button">Save</button></div>
        <div class="sheet-body"><div class="w-main">
          <div class="w-row">
            <button class="pick" type="button" aria-label="Memory date: today, ${M.date(e.entryDate, 'dayLong')}. Change">${icon('calendar', { size: 18 })}Today<small>${M.date(e.entryDate, 'day')}</small></button>
            <button class="pick" type="button" aria-label="Template: ${tpl.name}. Change">${icon('page', { size: 18 })}${tpl.name}</button>
          </div>
          <input class="w-title" type="text" value="${e.title}" placeholder="Title (optional)" aria-label="Title, optional">
          <div class="fmt" role="toolbar" aria-label="Formatting">
            <button type="button" aria-label="Bold">B</button><button type="button" class="i" aria-label="Italic">I</button>
            <button type="button" aria-label="Heading">H</button><button type="button" aria-label="Bullet list">${icon('list', { size: 20 })}</button>
          </div>
          <div class="editor prose" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Entry text">${M.caption(e.contentJson)}</div></div><div class="w-aside">
          <section class="w-sec" aria-labelledby="w-ph"><h2 id="w-ph">Photos</h2>
            <div class="strip">${imgs.map((m) => html`<img src="${M.src(m)}" alt="${m.alt}">`)}<button class="add" type="button">${icon('plus', { size: 22 })}<span>Add</span></button></div></section>
          <section class="w-sec" aria-labelledby="w-vn"><h2 id="w-vn">Voice note</h2>${voice(vn, 40)}</section>
          <section class="w-sec" aria-labelledby="w-tg"><h2 id="w-tg">Tags</h2>
            <div class="chips">${e.tags.map((t) => html`<span class="chip">${t.name}</span>`)}<button class="chip" type="button">${icon('plus', { size: 16 })}Add tag</button></div></section>
          <section class="w-sec" aria-labelledby="w-st"><h2 id="w-st">Soundtrack</h2>${track(e.soundtrack)}</section>
          <section class="seal" aria-labelledby="w-seal">
            <button class="seal-head" type="button" aria-expanded="true">${hourglass({ cls: 'hg' })}<b id="w-seal">Seal as Loot Drop</b>${icon('chevronRight', { size: 20 })}</button>
            <div class="quick" role="radiogroup" aria-label="Opens">${M.sealSuggestions().map((s) => html`<button type="button" role="radio" aria-checked="false"><b>${s.label}</b><small>${M.date(s.day, 'day')} ${s.day.slice(0, 4)}</small></button>`)}</div>
            <p>Nobody, including you, can open it until then.</p>
          </section>
        </div></div>
      </div></div>`;
  }

  function render(screen) {
    const out = {
      feed: () => shell('Home', feedBody()),
      entry: () => shell('Home', entryBody()),
      era: () => shell('Eras', eraBody()),
      loot: () => shell('Home', lootBody()),
      write: () => html`<div inert aria-hidden="true">${shell('Home', feedBody(true))}</div>${writeSheet()}`,
    }[screen]();
    app.innerHTML = String(out);
    document.title = `Nightstand: ${{ feed: 'Feed', entry: 'Entry', era: 'Era', loot: 'Loot Drop', write: 'Write' }[screen]}`;
  }
  M.mountApp(render);
})();
</script>
</body>
</html>
