# Settings for every profile (docs/TECH_STACK.md §2). A profile file (application-<profile>.yml) adds to these
# or overrides them: `local` reads the variables below from ../.env, and `test` sets its own values.
logging:
  level:
    # Hibernate writes every failed SQL statement to the log (this logger, at WARN) with PostgreSQL's whole message.
    # For a CHECK or NOT NULL failure that message ends with "Failing row contains (...)", and the row is the entry:
    # its title and text, a sealed Loot Drop's too. A unique-key failure names the value (a tag's name). Entry content
    # must never reach a log (.claude/rules/security.md, D-10), so this logger is off. GlobalExceptionHandler still logs
    # a failed request: the exception classes (with the SQLState) and the stack frames, never the message.
    # Quoted, because YAML reads an unquoted `off` as the boolean false. ErrorHandlingIntegrationTest keeps this honest.
    # To see the SQL messages while debugging on your own machine, run with
    # `--logging.level.org.hibernate.orm.jdbc.error=warn`, and only against throwaway data.
    org.hibernate.orm.jdbc.error: "off"

spring:
  application:
    name: memoirist

  # Which environment variables the app reads. `${VAR:}` means "empty if VAR isn't set", so a missing variable
  # fails at startup with the property's name. Without the `:`, Spring Boot keeps the text `${VAR}` as the value.
  datasource:
    url: ${DB_URL:}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it (D-16, every profile).
    hibernate:
      ddl-auto: validate
    # No database access after the service's transaction ends: lazy loading in a controller fails loudly instead
    # of quietly running extra queries. Services map entities to DTOs inside their transactions.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Read and write timestamps in UTC whatever zone the JVM runs in (D-07).
          time_zone: UTC
        type:
          # How a JSON column's Java value (a TipTap JsonNode, a list of headings) becomes text. Hibernate picks the
          # library itself, and with Jackson 2 (a transitive dependency of springdoc) and Jackson 3 (Spring Boot 4's)
          # both on the classpath it picks Jackson 2, which cannot read a Jackson 3 JsonNode. So name the one we use.
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper

  flyway:
    # The schema only. `local` and `test` add db/seed-local, the dev user (D-11). A profile's list replaces this
    # one; lists are never merged.
    locations:
      - classpath:db/migration

  web:
    # Error messages are English whatever the browser's Accept-Language says. Hibernate Validator ships French, German
    # and other translations, so by default "must not be blank" reaches a French browser as "ne doit pas être vide",
    # and the strings in API_CONTRACT (fieldErrors) would depend on who is asking.
    locale-resolver: fixed
    locale: en

    # Spring Boot's fallback error page (/error) answers what GlobalExceptionHandler can't reach, such as a failure in
    # a servlet filter. These are Boot's defaults, written down so that nobody turns a trace or a message on "just to
    # debug" and ships it: no stack trace, exception name, message or binding detail ever reaches a client.
    # ConfigurationTest keeps them there. In Spring Boot 4 the keys live under spring.web.error; the old
    # server.error.* names are silently ignored (a test with them set to "always" still saw "never").
    error:
      include-stacktrace: never
      include-exception: false
      include-message: never
      include-binding-errors: never

  servlet:
    multipart:
      # Spring's defaults (1MB per file, 10MB per request) would reject phone photos. D-17 allows 25 MB per file;
      # the request limit leaves room for the form's other fields. Spring's MB is 1024 x 1024 bytes.
      max-file-size: 25MB
      max-request-size: 30MB

# Object storage, bound to StorageProperties and checked at startup (TECH_STACK §2 Storage).
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
  region: ${STORAGE_REGION:}
  bucket: ${STORAGE_BUCKET:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  path-style: ${STORAGE_PATH_STYLE:}
  presign-ttl: ${STORAGE_PRESIGN_TTL:}
