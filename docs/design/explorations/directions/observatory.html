<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observatory direction for memoirist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Observatory: the journal as a night sky over Melbourne. True neutral dark, no glows. Every week carries the
   moon's real phase, drawn as it looks from the southern hemisphere; an Era is a constellation of its weeks; a
   sealed Loot Drop is a star whose light has not arrived yet. Moonlight is the one accent, kept for what is lit. */
:root {
  color-scheme: dark;
  --night: #0C0D0F;
  --surface: #15171A;     /* one step up: cards */
  --surface-2: #1F2226;   /* two steps: chips, the moon's dark side */
  --line: #2A2E33;
  --star: #E8E7E2;        /* text: 15:1 on night */
  --dust: #9C988F;        /* secondary: 6.7:1 */
  --moon: #F0DCA0;        /* the accent */
  --display: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --ui: 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
  --gutter: 18px;
  --dur: 160ms;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--night); color: var(--star); font: 400 16px/1.55 var(--ui); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { flex: none; }
.display { font-family: var(--display); }
.moonglyph { flex: none; display: block; }

/* ---------- Shell ---------- */
.rail-l { display: none; }
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 6px 0 var(--gutter); background: var(--night); border-bottom: 1px solid var(--line); }
.wordmark { font-family: var(--display); font-style: italic; font-size: 26px; line-height: 1; display: inline-flex; align-items: center; gap: 10px; }
.topbar .wordmark { margin-right: auto; }
.topbar .tb-title { margin-right: auto; font-size: 15px; font-weight: 600; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--star); }
.icon-btn:hover { background: var(--surface); }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--moon); color: var(--night); font-weight: 650; font-size: 15px; transition: opacity var(--dur); }
.pill:hover { opacity: .88; }
.pill--quiet { background: var(--surface-2); color: var(--star); }
.pill--ghost { background: none; color: var(--star); text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
@media (min-width: 1100px) {
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  .rail-l { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 28px 16px 22px 22px; border-right: 1px solid var(--line); }
  .rail-l .wordmark { padding: 0 10px; }
  .tonight { display: flex; align-items: center; gap: 10px; margin: 18px 10px 22px; font-size: 13px; color: var(--dust); line-height: 1.35; }
  .tonight b { display: block; color: var(--star); font-weight: 600; }
  .rail-l .pill { margin: 0 6px 18px; justify-content: center; }
  .nav a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 15px; color: var(--dust); }
  .nav a:hover { color: var(--star); background: var(--surface); }
  .nav a[aria-current="page"] { color: var(--star); background: var(--surface); }
  .rail-foot { margin-top: auto; }
  .topbar { display: none; }
}

/* ---------- Layout ---------- */
.main { padding: 0 var(--gutter) 64px; }
.log { display: grid; gap: 28px; }
@media (min-width: 1100px) {
  .main { display: grid; grid-template-columns: minmax(0, 640px) 300px; gap: 56px; justify-content: center; padding: 36px 40px 96px; }
  .feed { grid-column: 1; grid-row: 1; }
  .log { grid-column: 2; grid-row: 1; position: sticky; top: 36px; align-content: start; }
  .feed .week-log--lead { display: none; }
}
@media (max-width: 1099px) { .log .week-log { display: none; } .log { margin-top: 18px; } }

.sky-now { display: flex; align-items: center; gap: 14px; padding: 20px 0 6px; }
.sky-now h1 { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.sky-now p { font-size: 14px; color: var(--dust); }
.log-h { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.2; margin-bottom: 4px; }
.log-sub { font-size: 13px; color: var(--dust); }

/* On this day: the same night in other years */
.otd { display: grid; gap: 12px; }
.otd-item { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px; border-radius: 12px; background: var(--surface); }
.otd-item:hover { background: var(--surface-2); }
.otd-item img { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; }
.otd-item b { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; }
.otd-item small { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dust); margin-top: 3px; }

/* An Era's heading: its cover under a neutral scrim, with its name in the atlas face */
.era-band { position: relative; display: block; margin: 36px calc(-1 * var(--gutter)) 0; height: 200px; overflow: hidden; }
.era-band img { width: 100%; height: 100%; object-fit: cover; }
.era-band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(12, 13, 15, .92), rgba(12, 13, 15, .15) 70%); } /* taste-skill-ignore: a neutral scrim under text on a photo */
.era-band .t { position: absolute; z-index: 1; left: var(--gutter); right: var(--gutter); bottom: 16px; }
.era-band h2 { font-family: var(--display); font-size: 34px; line-height: 1.05; }
.era-band p { font-size: 13px; color: #CDCCC7; margin-top: 4px; }
@media (min-width: 1100px) { .era-band { margin: 44px 0 0; border-radius: 12px; height: 220px; } .era-band .t { left: 24px; bottom: 20px; } }

/* A week's observing log (the week summary, D-25) */
.week-head { display: flex; align-items: center; gap: 14px; margin-top: 28px; }
.week-head h3 { font-family: var(--display); font-size: 26px; line-height: 1.1; }
.week-head p { font-size: 13px; color: var(--dust); margin-top: 2px; }
.week-log { margin-top: 14px; padding: 16px; border-radius: 12px; background: var(--surface); display: grid; gap: 14px; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11.5px; color: var(--dust); }
.days span { display: grid; justify-items: center; gap: 6px; }
.days i { width: 9px; height: 9px; border-radius: 50%; background: var(--surface-2); outline: 1px solid var(--line); }
.days i.on { background: var(--moon); outline: 0; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.counts div { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.counts b { display: block; font-size: 20px; font-weight: 600; line-height: 1.1; }
.counts small { font-size: 12px; color: var(--dust); }
.bars { list-style: none; margin: 0; padding: 0; display: grid; }
.bars a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; border-top: 1px solid var(--line); font-size: 14px; }
.bars a:hover .bt { text-decoration: underline; }
.bars .bd { font-size: 12px; color: var(--dust); }
.bars .bt { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bars .bi { display: flex; gap: 4px; color: var(--dust); }
.bars .sealed .bt { color: var(--moon); display: flex; gap: 6px; align-items: center; }
.log-foot { font-size: 13px; color: var(--dust); }
.log-foot a { color: var(--star); text-decoration: underline; text-underline-offset: 3px; }

/* Posts */
.post { margin-top: 28px; display: grid; gap: 12px; }
.post-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dust); }
.post h4 { font-family: var(--display); font-size: 24px; line-height: 1.15; }
.post h4 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.pic { position: relative; }
.pic img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: var(--surface); }
.pic.page img { aspect-ratio: 3 / 4; width: min(100%, 360px); }
.pic .count { position: absolute; right: 10px; top: 10px; padding: 3px 9px; border-radius: 999px; background: rgba(12, 13, 15, .78); font-size: 12px; font-weight: 600; }
.caption { color: var(--star); }
.caption p + p, .caption ul + p, .caption p + ul { margin-top: .6em; }
.caption h3, .caption h4, .caption h5 { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--moon); margin: .9em 0 .1em; }
.caption > :first-child { margin-top: 0; }
.caption ul { margin: .3em 0 0; padding-left: 1.2em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--star); }
.extras { display: flex; flex-wrap: wrap; gap: 8px; }
.voice { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 6px; border-radius: 999px; background: var(--surface); min-width: 0; max-width: 100%; }
.voice .play { width: 34px; height: 34px; border-radius: 50%; background: var(--moon); color: var(--night); display: grid; place-items: center; flex: none; }
.voice svg { width: 140px; min-width: 0; height: 22px; fill: var(--moon); }
.voice .dur { font-size: 13px; color: var(--dust); }
.sound { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 16px 0 12px; border-radius: 999px; background: var(--surface); font-size: 14px; min-width: 0; max-width: 100%; }
.sound span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sound .spot { color: var(--dust); display: grid; }
.sound i { font-style: italic; font-family: var(--display); font-size: 16px; }

/* The sealed Loot Drop: one star whose light is still travelling. Same size for every Loot Drop (D-10). */
.starcard { position: relative; display: grid; align-content: end; gap: 4px; height: 230px; padding: 20px; border-radius: 12px; background: var(--surface); overflow: hidden; }
.starcard:hover { background: var(--surface-2); }
.starcard .field { position: absolute; inset: 0; width: 100%; height: 100%; }
.starcard > span { position: relative; }
.starcard .h { font-family: var(--display); font-size: 24px; line-height: 1.1; }
.starcard .when { font-size: 14px; color: var(--star); }
.starcard .count { font-family: var(--display); font-style: italic; font-size: 20px; color: var(--moon); }

/* ---------- Entry ---------- */
.entry { display: grid; gap: 18px; padding-top: 18px; }
.entry h1 { font-family: var(--display); font-size: 38px; line-height: 1.05; }
.entry .pic img { aspect-ratio: 4 / 3; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.strip img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; opacity: .55; }
.strip img.on { opacity: 1; outline: 2px solid var(--moon); outline-offset: 2px; }
.notes { display: grid; gap: 14px; }
.note { padding: 14px 16px; border-radius: 12px; background: var(--surface); font-size: 14px; color: var(--dust); }
.note b { display: block; color: var(--star); font-weight: 600; margin-bottom: 2px; }
.note .row { display: flex; align-items: center; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (min-width: 1100px) {
  .entry h1 { font-size: 46px; }
  .entry-wrap { display: grid; grid-template-columns: minmax(0, 680px) 280px; gap: 48px; justify-content: center; padding: 36px 40px 96px; }
  .entry-wrap .notes { position: sticky; top: 36px; align-content: start; padding-top: 70px; }
}
@media (max-width: 1099px) { .entry-wrap { padding: 0 var(--gutter) 64px; } .entry-wrap .notes { margin-top: 18px; } }

/* ---------- Era: a constellation ---------- */
.era-top { position: relative; margin: 0 calc(-1 * var(--gutter)); height: 260px; overflow: hidden; }
.era-top img { width: 100%; height: 100%; object-fit: cover; }
.era-top::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(12, 13, 15, 1), rgba(12, 13, 15, .2) 75%); } /* taste-skill-ignore: a neutral scrim under text on a photo */
.era-top .t { position: absolute; z-index: 1; left: var(--gutter); right: var(--gutter); bottom: 18px; }
.era-top h1 { font-family: var(--display); font-size: 40px; line-height: 1.02; }
.era-top p { color: #CDCCC7; font-size: 14px; margin-top: 6px; }
.era-desc { font-family: var(--display); font-style: italic; font-size: 20px; line-height: 1.35; margin-top: 18px; }
.era-figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.era-figs div { padding: 12px; border-radius: 10px; background: var(--surface); }
.era-figs b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
.era-figs small { font-size: 12px; color: var(--dust); }
.chart { margin-top: 26px; padding: 16px 0 6px; border-radius: 12px; background: var(--surface); }
.chart h2 { font-family: var(--display); font-style: italic; font-size: 22px; padding: 0 16px; }
.chart p { font-size: 13px; color: var(--dust); padding: 2px 16px 0; }
.chart svg { display: block; width: 100%; height: auto; margin-top: 8px; }
.chart text { fill: var(--dust); font: 500 11px var(--ui); }
.chart text.name { fill: var(--star); font: italic 15px var(--display); }
.weeks { list-style: none; margin: 18px 0 0; padding: 0; }
.weeks a { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 56px; border-bottom: 1px solid var(--line); }
.weeks a:hover .wt { text-decoration: underline; }
.weeks .wt { font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.weeks small { display: block; font-size: 12.5px; color: var(--dust); }
.weeks .wn { font-size: 14px; color: var(--dust); }
.weeks .wn b { color: var(--star); font-weight: 600; }
@media (min-width: 1100px) {
  .era-page { display: grid; grid-template-columns: minmax(0, 680px) 300px; gap: 48px; justify-content: center; padding: 36px 40px 96px; }
  .era-top { margin: 0; border-radius: 12px; height: 300px; }
  .era-top .t { left: 28px; bottom: 24px; }
  .era-top h1 { font-size: 52px; }
  .era-side { display: grid; gap: 24px; align-content: start; padding-top: 4px; }
}
@media (max-width: 1099px) { .era-page { padding: 0 var(--gutter) 64px; } .era-side { margin-top: 26px; display: grid; gap: 24px; } }
.inside { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.inside a { display: block; padding: 12px 14px; border-radius: 10px; background: var(--surface); }
.inside b { display: block; font-family: var(--display); font-size: 19px; font-weight: 400; }
.inside small { font-size: 13px; color: var(--dust); }

/* ---------- Loot Drop ---------- */
.loot { position: relative; min-height: calc(100vh - 56px); overflow: hidden; display: grid; align-content: end; padding: 0 var(--gutter) 40px; }
.loot .field { position: absolute; inset: 0; width: 100%; height: 100%; }
.loot-text { position: relative; display: grid; gap: 12px; max-width: 520px; }
.loot-text h1 { font-family: var(--display); font-size: 34px; line-height: 1.05; }
.loot-text .arrives { font-size: 17px; line-height: 1.45; }
.loot-text .big { font-family: var(--display); font-style: italic; font-size: 52px; line-height: 1; color: var(--moon); }
.loot-text .moonline { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--dust); }
.loot-text .rule { font-size: 15px; color: var(--dust); }
@media (min-width: 1100px) {
  .loot { min-height: 100vh; align-content: center; padding: 0 0 0 120px; }
  .loot-text h1 { font-size: 46px; }
  .loot-text .big { font-size: 72px; }
}

/* ---------- Review fixes (2026-10-29) ---------- */
/* A1: the first phone screen reaches an entry. */
.sky-now { padding: 14px 0 4px; gap: 12px; }
.sky-now h1 { font-size: 26px; }
.sky-now p { font-size: 13px; }
.otd-phone { margin-top: 12px; }
.otd-phone .log-h { font-size: 17px; }
.otd-phone .otd { display: flex; gap: 10px; overflow-x: auto; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); scrollbar-width: none; }
.otd-phone .otd::-webkit-scrollbar { display: none; }
.otd-phone .otd-item { flex: none; width: 250px; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 8px; }
.otd-phone .otd-item img { width: 52px; height: 52px; }
.log { display: none; }
@media (min-width: 1100px) { .log { display: grid; } .otd-phone { display: none; } }
@media (max-width: 1099px) { .era-band { height: 150px; margin-top: 18px; } .era-band h2 { font-size: 30px; } }
.week-line { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 10px 0 12px; border-bottom: 1px solid var(--line); color: var(--star); }
.week-line > span { flex: 1; min-width: 0; }
.week-line h3 { font-family: var(--display); font-size: 24px; line-height: 1.15; }
.week-line small { display: block; font-size: 13px; color: var(--dust); margin-top: 2px; }
.week-line .icon { color: var(--dust); }
.post { grid-template-columns: minmax(0, 1fr); }
.post > * { min-width: 0; }
.week-line + .post { margin-top: 20px; }

/* O5: small thumbnails and one quiet line, so the writing comes sooner. */
.entry-wrap { display: block; }
@media (min-width: 1100px) { .entry-wrap { display: grid; grid-template-columns: minmax(0, 680px); } }
.strip { grid-template-columns: repeat(4, 64px); }
.strip img { width: 64px; height: 48px; aspect-ratio: auto; }
.quiet-line { font-size: 14px; color: var(--dust); }

/* A4: one Write button within thumb reach. */
.write { position: relative; }
.write-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px 0 18px; border-radius: 999px; background: var(--moon); color: var(--night); font-weight: 650; font-size: 16px; }
.write-btn:hover { opacity: .9; }
.write-menu { position: absolute; z-index: 30; display: grid; min-width: 210px; padding: 6px; border-radius: 14px; background: var(--surface-2); box-shadow: 0 12px 32px rgba(0, 0, 0, .5), 0 0 0 1px var(--line); }
.write-menu[hidden] { display: none; }
.write-menu button { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 15px; color: var(--star); text-align: left; }
.write-menu button:hover { background: var(--surface); }
.write--fab { position: fixed; z-index: 20; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.write--fab .write-menu { right: 0; bottom: calc(100% + 10px); }
.write--side { margin: 22px 6px 18px; }
.write--side .write-btn { width: 100%; min-height: 46px; }
.write--side .write-menu { left: 0; right: 0; top: calc(100% + 8px); }
.main, .entry-wrap, .era-page, .loot { padding-bottom: 110px; }
@media (min-width: 1100px) { .write--fab { display: none; } }

/* A8: Spotify's mark in white. */
.sound .spot { color: #FFFFFF; }

/* Scrolling rows stay inside the page gutter, so a half-shown card is clipped 16-20px in, never at the screen edge. */
@media (max-width: 1099px) { .otd-phone .otd { margin: 0; padding: 0; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail-l" id="rail" aria-label="memoirist"></nav>
  <div id="app"></div>
</div>
<script src="../shared/content.js"></script>
<script src="../shared/helpers.js"></script>
<script>
(() => {
  const { html, icon, date, range } = M;
  const rail = document.getElementById('rail');
  const app = document.getElementById('app');
  const plural = (n, one, many = `${one}s`) => `${n.toLocaleString('en-AU')} ${n === 1 ? one : many}`;

  // The moon as it looks from Melbourne: the southern hemisphere sees a waxing moon lit on the left.
  function moonSvg(d, size = 28) {
    const m = M.moon(d), r = size / 2 - 1, c = size / 2;
    const k = m.illumination, waxing = m.phase < 0.5;
    const litLeft = waxing;                       // southern hemisphere
    const rx = (r * Math.abs(1 - 2 * k)).toFixed(2);
    const gibbous = k > 0.5;
    const limb = `M${c} ${c - r}A${r} ${r} 0 0 ${litLeft ? 0 : 1} ${c} ${c + r}`;
    const term = `A${rx} ${r} 0 0 ${litLeft ? (gibbous ? 0 : 1) : (gibbous ? 1 : 0)} ${c} ${c - r}`;
    return M.raw(`<svg class="moonglyph" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${m.name}, ${Math.round(k * 100)}% lit">
      <circle cx="${c}" cy="${c}" r="${r}" fill="#1F2226" stroke="#2A2E33"/>${k > 0.02 ? `<path d="${limb}${term}Z" fill="#F0DCA0"/>` : ''}</svg>`);
  }
  const moonWords = (d) => { const m = M.moon(d); return `${m.name.toLowerCase()}, ${Math.round(m.illumination * 100)}% lit`; };

  // A field of stars, the same every time for the same seed. The one star that matters is drawn larger; with a
  // trail, a faint dashed line shows the way its light is travelling and a bright stretch shows how far it has come.
  function starfield(seed, w, h, { n = 90, hero = null, trail = null } = {}) {
    const rnd = M.seeded(seed);
    let dots = '';
    for (let i = 0; i < n; i++) {
      const x = (rnd() * w).toFixed(1), y = (rnd() * h).toFixed(1), r = (0.4 + rnd() * rnd() * 1.4).toFixed(2);
      dots += `<circle cx="${x}" cy="${y}" r="${r}" fill="#E8E7E2" opacity="${(0.25 + rnd() * 0.55).toFixed(2)}"/>`;
    }
    let path = '';
    if (hero && trail) {
      const [x0, y0] = hero, [x1, y1] = trail.to;
      const len = Math.hypot(x1 - x0, y1 - y0), done = Math.max(trail.done * len, 14) / len;
      path = `<path d="M${x0} ${y0}L${x1} ${y1}" stroke="#F0DCA0" stroke-opacity=".28" stroke-width="1.2" stroke-dasharray="2 7"/>`
        + `<path d="M${x0} ${y0}L${(x0 + (x1 - x0) * done).toFixed(1)} ${(y0 + (y1 - y0) * done).toFixed(1)}" stroke="#F0DCA0" stroke-width="2.4" stroke-linecap="round"/>`;
    }
    const star = hero ? `<g stroke="#F0DCA0" stroke-width="1.2" stroke-linecap="round" opacity=".9"><path d="M${hero[0]} ${hero[1] - 18}V${hero[1] + 18}M${hero[0] - 18} ${hero[1]}H${hero[0] + 18}"/></g><circle cx="${hero[0]}" cy="${hero[1]}" r="5.5" fill="#F0DCA0"/>` : '';
    return M.raw(`<svg class="field" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${dots}${path}${star}</svg>`);
  }

  const NAV = [
    { label: 'Journal', icon: 'book', href: '#feed', screens: ['feed', 'entry', 'loot'] },
    { label: 'Eras', icon: 'layers', href: '#era', screens: ['era'] },
    { label: 'Timeline', icon: 'list', href: '#feed', screens: [] },
    { label: 'Templates', icon: 'page', href: '#feed', screens: [] },
    { label: 'Tags', icon: 'tag', href: '#feed', screens: [] },
  ];
  const mark = M.raw('<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 1.5a7.5 7.5 0 1 0 5.5 12.6A6.5 6.5 0 0 1 11 1.5z" fill="#F0DCA0"/></svg>');
  function renderRail(screen) {
    rail.innerHTML = String(html`
      <a class="wordmark" href="#feed">${mark}memoirist</a>
      ${M.writeMenu({ label: 'Write', cls: 'write--side' })}
      <div class="nav">${NAV.map((n) => html`<a href="${n.href}" ${n.screens.includes(screen) ? M.raw('aria-current="page"') : ''}>${icon(n.icon, { size: 20 })}${n.label}</a>`)}</div>
      <div class="nav rail-foot"><a href="#feed">${icon('trash', { size: 20 })}Recently deleted</a><a href="#feed">${icon('sliders', { size: 20 })}Settings</a></div>`);
  }
  function topbar({ back, title } = {}) {
    if (back) return html`<header class="topbar"><a class="icon-btn" href="${back.href}" aria-label="Back to ${back.label}">${icon('arrowLeft', { size: 22 })}</a><span class="tb-title">${title}</span></header>`;
    return html`<header class="topbar"><a class="wordmark" href="#feed">${mark}memoirist</a></header>`;
  }

  function voice(v) {
    const bars = M.waveform(v.id, 34);
    return html`<span class="voice"><button class="play" aria-label="Play voice note, ${M.duration(v.durationSeconds)}">${icon('play', { size: 14 })}</button>
      <svg viewBox="0 0 ${bars.length * 4} 22" preserveAspectRatio="none" aria-hidden="true">${M.raw(bars.map((b, i) => `<rect x="${i * 4}" y="${(11 - b * 10).toFixed(1)}" width="2" rx="1" height="${(b * 20).toFixed(1)}"/>`).join(''))}</svg>
      <span class="dur">${M.duration(v.durationSeconds)}</span></span>`;
  }
  const sound = (st) => html`<button class="sound"><span class="spot">${icon('spotify', { size: 18 })}</span><span><i>${st.title}</i>, ${st.artist}</span></button>`;
  const tags = (ts) => html`<div class="tags">${ts.map((t) => html`<a class="tag" href="#feed">${t.name}</a>`)}</div>`;

  function weekLog(w, { lead = false } = {}) {
    const s = M.weekStats(w);
    return html`<section class="week-log ${lead ? 'week-log--lead' : ''}" aria-label="Log of ${M.weekLabel(w)}">
      <div class="days" aria-label="Days written">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => html`<span><i class="${s.days[i] ? 'on' : ''}"></i>${d}</span>`)}</div>
      <div class="counts"><div><b>${s.entryCount}</b><small>${s.entryCount === 1 ? 'entry' : 'entries'}</small></div><div><b>${s.photoCount}</b><small>photos</small></div><div><b>${s.voiceNoteCount}</b><small>${s.voiceNoteCount === 1 ? 'voice note' : 'voice notes'}</small></div></div>
      <ul class="bars">${w.entries.map((e) => M.isSealed(e)
        ? html`<li><a class="sealed" href="#loot"><span class="bd">${date(e.entryDate, 'weekdayShort')}</span><span class="bt">${icon('lock', { size: 15 })}Sealed until ${M.instant(e.unlockDate, { day: 'numeric', month: 'short', year: 'numeric' })}</span><span></span></a></li>`
        : html`<li><a href="#entry"><span class="bd">${date(e.entryDate, 'weekdayShort')}</span><span class="bt">${M.displayTitle(e)}</span><span class="bi">${M.images(e).length ? icon(M.images(e)[0].kind === 'PAGE_SCAN' ? 'page' : 'image', { size: 16 }) : ''}${M.voiceNotes(e).length ? icon('mic', { size: 16 }) : ''}</span></a></li>`)}</ul>
      ${w.eras.length > 1 ? html`<p class="log-foot">Also in ${w.eras.slice(1).map((er) => html`<a href="#era">${er.title}</a>`)}</p>` : ''}
    </section>`;
  }

  function post(e) {
    if (M.isSealed(e)) {
      const u = M.opening(e);
      return html`<article class="post" data-sealed><p class="post-meta">${moonSvg(e.entryDate, 16)}${date(e.entryDate, 'dayLong')}</p>
        <a class="starcard" href="#loot">${starfield(e.id, 640, 230, { n: 70, hero: [520, 70] })}
          <span class="h">A star still on its way</span><span class="when">${u.opens.replace(/^Opens/, 'Its light arrives')}</span><span class="count">${u.countdown}</span></a></article>`;
    }
    const pics = M.images(e);
    const heading = e.title || (e.contentJson ? null : M.displayTitle(e));
    return html`<article class="post" aria-label="${M.displayTitle(e)}">
      <p class="post-meta">${moonSvg(e.entryDate, 16)}${date(e.entryDate, 'dayLong')}</p>
      ${heading ? html`<h4><a href="#entry">${heading}</a></h4>` : ''}
      ${pics.length ? html`<a class="pic ${pics[0].kind === 'PAGE_SCAN' ? 'page' : ''}" href="#entry"><img src="${M.src(pics[0])}" alt="${pics[0].alt}">${pics.length > 1 ? html`<span class="count">1 of ${pics.length}</span>` : ''}</a>` : ''}
      ${e.contentJson ? html`<div class="caption">${M.caption(e.contentJson, { headingTag: 'h5' })}</div>` : ''}
      ${M.voiceNotes(e).length || e.soundtrack ? html`<div class="extras">${M.voiceNotes(e).map(voice)}${e.soundtrack ? sound(e.soundtrack) : ''}</div>` : ''}
      ${e.tags.length ? tags(e.tags) : ''}
    </article>`;
  }

  // A week in the feed is one line; tapping it opens the week's summary (D-25). Sealed entries never count (D-10).
  function weekLine(w) {
    const s = M.weekStats(w);
    const facts = [plural(s.entryCount, 'entry', 'entries'), s.photoCount && plural(s.photoCount, 'photo'), s.voiceNoteCount && plural(s.voiceNoteCount, 'voice note')].filter(Boolean).join(', ');
    return html`<a class="week-line" href="#feed" aria-label="${M.weekLabel(w)}: open the week's summary">
      <span><h3>${M.weekLabel(w)}</h3><small>${range(w.startDate, w.endDate)}, beginning under a ${M.moon(w.startDate).name.toLowerCase()}. ${facts}.</small></span>${icon('chevronRight', { size: 20 })}</a>`;
  }

  function sameNight(id) {
    return html`<section class="otd-wrap" aria-labelledby="${id}">
      <h2 class="log-h" id="${id}">The same night, other years</h2>
      <div class="otd">${M.data.onThisDay.map((e) => html`<a class="otd-item" href="#entry"><img src="${M.src(M.images(e)[0])}" alt="${M.images(e)[0].alt}">
        <span><b>${e.title}</b><small>${M.yearsAgo(e.entryDate)}, ${date(e.entryDate, 'medium')}</small></span></a>`)}</div></section>`;
  }

  function feed() {
    return html`${topbar()}
      <main class="main">
        <div class="feed">
          <header class="sky-now">${moonSvg(M.today(), 34)}<div><h1>${date(M.today(), 'weekday')} night</h1><p>${date(M.today(), 'long')}, ${moonWords(M.today())}</p></div></header>
          <div class="otd-phone">${sameNight('otd-h-phone')}</div>
          ${M.feedGroups().map((g) => html`
            ${g.era ? html`<a class="era-band" href="#era"><img src="${M.cover(g.era)}" alt=""><span class="t"><h2>${g.era.title}</h2><p>${range(g.era.startDate, g.era.endDate)}</p></span></a>` : ''}
            ${g.weeks.map((w) => html`${weekLine(w)}${w.entries.map(post)}`)}`)}
        </div>
        <aside class="log" aria-label="On this day">${sameNight('otd-h')}</aside>
      </main>
      ${M.writeMenu({ label: 'Write', cls: 'write--fab' })}`;
  }

  // ---------- Entry ----------
  function entryScreen() {
    const e = M.featured.entry(), w = M.weekOf(e.id), pics = M.images(e);
    return html`${topbar({ back: { href: '#feed', label: 'Journal' }, title: M.weekLabel(w) })}
      <main class="entry-wrap">
        <article class="entry">
          <p class="post-meta">${moonSvg(e.entryDate, 18)}${date(e.entryDate, 'long')}, ${moonWords(e.entryDate)}</p>
          <h1>${e.title}</h1>
          <div class="pic"><img src="${M.src(pics[0])}" alt="${pics[0].alt}"><span class="count">1 of ${pics.length}</span></div>
          <div class="strip">${pics.map((m, i) => html`<img class="${i === 0 ? 'on' : ''}" src="${M.src(m)}" alt="">`)}</div>
          <div class="caption">${M.caption(e.contentJson, { headingTag: 'h3' })}</div>
          <div class="extras">${M.voiceNotes(e).map(voice)}${sound(e.soundtrack)}</div>
          ${tags(e.tags)}
          <p class="quiet-line">In ${w.eras.map((er) => er.title).join(' and ')}, ${M.weekLabel(w)}</p>
          <div class="actions"><a class="pill pill--quiet" href="#entry">${icon('pen', { size: 18 })}Edit this entry</a><a class="pill pill--quiet" href="#loot">${icon('lock', { size: 18 })}Seal as a Loot Drop</a><button class="pill pill--ghost">Delete</button></div>
        </article>
      </main>
      ${M.writeMenu({ label: 'Write', cls: 'write--fab' })}`;
  }

  // ---------- Era ----------
  function constellation(id) {
    const series = M.eraSeries(id), e = M.era(id);
    const W = 640, H = 240, padX = 22, top = 40, bottom = 30;
    const t0 = Date.parse(e.startDate), t1 = Date.parse(M.today());
    const x = (d) => padX + ((Date.parse(d) - t0) / (t1 - t0)) * (W - 2 * padX);
    const rnd = M.seeded(`${id}-sky`);
    // Scattered rather than plotted, so height can't be read as a trend: only left to right means anything (time).
    const pts = series.map((wk) => ({ ...wk, x: x(wk.startDate), y: top + 10 + rnd() * (H - top - bottom - 20), r: 1.1 + Math.sqrt(wk.entryCount) * 1.05 }));
    const named = ['era-japan', 'era-grampians'].map((cid) => {
      const c = M.era(cid);
      const ps = pts.filter((pt) => pt.startDate <= c.endDate && M.addDays(pt.startDate, 6) >= c.startDate);
      const lines = ps.length > 1 ? `<path d="${ps.map((pt, i) => `${i ? 'L' : 'M'}${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join('')}" fill="none" stroke="#F0DCA0" stroke-opacity=".6" stroke-width="1"/>` : '';
      const cx = x(c.startDate), cy = ps.length ? Math.min(...ps.map((pt) => pt.y)) : top + 10;
      const anchor = cx > W - 140 ? 'end' : 'start';
      return `${lines}<path d="M${cx.toFixed(1)} ${(cy - 8).toFixed(1)}V${top - 6}" stroke="#9C988F" stroke-width="1" stroke-dasharray="2 3"/><text class="name" x="${(cx + (anchor === 'end' ? -6 : 6)).toFixed(1)}" y="${top - 10}" text-anchor="${anchor}">${M.esc(c.title)}</text>`;
    }).join('');
    const stars = pts.map((pt) => `<a href="#feed" aria-label="${M.esc(pt.listed ? pt.title : `Week of ${M.date(pt.startDate, 'medium')}`)}, ${pt.entryCount} ${pt.entryCount === 1 ? 'entry' : 'entries'}"><circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="10" fill="transparent"/><circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${pt.r.toFixed(2)}" fill="${pt.listed ? '#F0DCA0' : '#E8E7E2'}" opacity="${pt.listed ? 1 : 0.8}"/></a>`).join('');
    const years = [2024, 2025, 2026].map((yv) => { const xx = x(`${yv}-01-01`); return xx > padX ? `<text x="${xx.toFixed(1)}" y="${H - 8}">${yv}</text>` : `<text x="${padX}" y="${H - 8}">Mar ${yv}</text>`; }).join('');
    return M.raw(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Every week of ${M.esc(e.title)} as a star, left to right in time, sized by its entries">${named}${stars}${years}</svg>`);
  }

  function eraScreen() {
    const p = M.eraPage(M.data.featured.eraId), e = p.era, t = p.totals;
    return html`${topbar({ back: { href: '#feed', label: 'Journal' }, title: 'Eras' })}
      <main class="era-page">
        <div class="era-main">
          <header class="era-top"><img src="${M.cover(e)}" alt="Victorian terrace houses with iron lace verandahs, the cover of this Era"><span class="t"><h1>${e.title}</h1><p>${range(e.startDate, e.endDate)}, ${p.span} so far</p></span></header>
          <p class="era-desc">${e.description}</p>
          <div class="era-figs"><div><b>${t.weekCount}</b><small>weeks</small></div><div><b>${t.entryCount}</b><small>entries</small></div><div><b>${t.photoCount.toLocaleString('en-AU')}</b><small>photos</small></div><div><b>${t.voiceNoteCount}</b><small>voice notes</small></div></div>
          <section class="chart" aria-labelledby="sky-h"><h2 id="sky-h">The constellation</h2><p>Every week of this Era is a star, left to right in time and sized by its entries; the newest are lit. Tap one to open its week.</p>${constellation(e.id)}</section>
          <ul class="weeks">${p.rows.map((r) => html`<li><a href="#feed"><span><span class="wt">${r.title}</span><small>${range(r.startDate, r.endDate)}</small></span><span class="wn"><b>${r.entryCount}</b> ${r.entryCount === 1 ? 'entry' : 'entries'}</span></a></li>`)}</ul>
        </div>
        <aside class="era-side">
          <div class="extras">${sound(e.soundtrack)}</div>
          <section aria-labelledby="in-h"><h2 class="log-h" id="in-h">Eras inside this one</h2>
            <ul class="inside">${p.chaptersInside.map((c) => html`<li><a href="#era"><b>${c.title}</b><small>${range(c.startDate, c.endDate)}</small></a></li>`)}</ul></section>
          <a class="pill pill--quiet" href="#era" style="justify-self:start">${icon('calendar', { size: 18 })}Change dates or cover</a>
        </aside>
      </main>
      ${M.writeMenu({ label: 'Write', cls: 'write--fab' })}`;
  }

  // ---------- Loot Drop ----------
  function lootScreen() {
    const e = M.featured.lootDrop(), w = M.weekOf(e.id), u = M.opening(e);
    const opensOn = M.instant(e.unlockDate, { year: 'numeric', month: '2-digit', day: '2-digit' }).split('/').reverse().join('-');
    return html`${topbar({ back: { href: '#feed', label: 'Journal' }, title: M.weekLabel(w) })}
      <main class="loot">
        ${starfield(e.id, 1200, 900, { n: 220, hero: [660, 170], trail: { to: [150, 860], done: (M.now - Date.parse(e.createdAt)) / (Date.parse(e.unlockDate) - Date.parse(e.createdAt)) } })}
        <div class="loot-text">
          <h1>Sealed Loot Drop</h1>
          <p class="arrives">${u.opens.replace(/^Opens/, 'Its light arrives on')}</p>
          <p class="big">${u.countdown}</p>
          <p class="moonline">${moonSvg(opensOn, 34)}The moon that morning: ${moonWords(opensOn)}</p>
          <p class="rule">Written ${date(e.entryDate, 'long')}. Nobody can read it or change it before then, you included.</p>
          <div class="actions"><button class="pill">${icon('clock', { size: 18 })}Extend the seal</button><button class="pill pill--ghost">Delete</button></div>
        </div>
      </main>
      ${M.writeMenu({ label: 'Write', cls: 'write--fab' })}`;
  }

  const SCREENS = { feed, entry: entryScreen, era: eraScreen, loot: lootScreen };
  M.mount((screen) => { renderRail(screen); app.innerHTML = String(SCREENS[screen]()); });
})();
</script>
</body>
</html>
