<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Folio: your life typeset as a modern book. Newsreader for titles and entry text, Instrument Sans for the interface.
   Tokens per theme and mode; each dark mode is designed on its own (dark grey-green or warm grey, never black). */
:root {
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --page: #F3F5F1; --surface: #FFFFFF; --raised: #E8ECE6; --side: #ECF0EA; --line: #D3DBD5; --control: #B9C4BD;
  --ink: #1A1F1C; --ink2: #53605A;
  --accent: #2E5A44; --on-accent: #FFFFFF;
  --cloth: #2E5A44; --on-cloth: #FFFFFF; --on-cloth2: #D2E1D8;
  --loot: #2E5A44;
  --vol-cover: #3C6B53; --vol-spine: #2E5A44; --vol-pages: #E4E8E0; --band: #FBFBF8; --band-ink: #1A1F1C; --ribbon: #1E4232; --vol-shadow: rgba(26, 40, 32, .28);
  --spot: #191414; --scrim: rgba(20, 28, 24, .48); --float: 0 18px 48px rgba(16, 26, 20, .18), 0 2px 6px rgba(16, 26, 20, .08);
  --wave: #6E7C74; --sheet-shadow: 0 4px 10px rgba(16, 26, 20, .1);
  color-scheme: light;
}
[data-theme="a"][data-mode="light"] { /* Bookcloth green, morning */ }
[data-theme="a"][data-mode="dark"] {
  /* Bookcloth green at night: a grey-green lamp-lit page, not black; the green softened to sage. */
  --page: #1E2622; --surface: #27312C; --raised: #303B36; --side: #222B26; --line: #3B4842; --control: #5A6A61;
  --ink: #E6ECE8; --ink2: #A3B1A9;
  --accent: #97CBAE; --on-accent: #12201A;
  --cloth: #2C4A3B; --on-cloth: #EEF3EF; --on-cloth2: #BFD3C7;
  --loot: #97CBAE;
  --vol-cover: #4E806A; --vol-spine: #3B6653; --vol-pages: #CFD8D2; --band: #EEF2EE; --band-ink: #1E2622; --ribbon: #97CBAE; --vol-shadow: rgba(0, 0, 0, .45);
  --spot: #1DB954; --scrim: rgba(6, 10, 8, .62); --float: 0 18px 48px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --wave: #8E9C94; --sheet-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
[data-theme="b"][data-mode="light"] {
  /* Ink and red: black cloth, a red ribbon and a red rubric on the one action. */
  --page: #F2F2EF; --surface: #FFFFFF; --raised: #E7E7E3; --side: #EBEBE7; --line: #D6D6D0; --control: #BDBDB5;
  --ink: #151515; --ink2: #57574F;
  --accent: #C21F2B; --on-accent: #FFFFFF;
  --cloth: #1F1F1E; --on-cloth: #F4F4F1; --on-cloth2: #CFCFC8;
  --loot: #C21F2B;
  --vol-cover: #232322; --vol-spine: #121212; --vol-pages: #E2E2DC; --band: #FBFBF8; --band-ink: #151515; --ribbon: #C21F2B; --vol-shadow: rgba(20, 20, 20, .3);
  --spot: #191414; --scrim: rgba(18, 18, 18, .5); --float: 0 18px 48px rgba(0, 0, 0, .18), 0 2px 6px rgba(0, 0, 0, .08);
  --wave: #74746C;
  color-scheme: light;
}
[data-theme="b"][data-mode="dark"] {
  --page: #212121; --surface: #2B2B2B; --raised: #343434; --side: #252525; --line: #3F3F3F; --control: #5E5E58;
  --ink: #EDEDE9; --ink2: #ABABA4;
  --accent: #F2777E; --on-accent: #1E1E1E;
  --cloth: #3A3A38; --on-cloth: #F2F2EE; --on-cloth2: #C8C8C1;
  --loot: #F2777E;
  --vol-cover: #444442; --vol-spine: #343432; --vol-pages: #D8D8D2; --band: #EFEFEA; --band-ink: #212121; --ribbon: #F2777E; --vol-shadow: rgba(0, 0, 0, .5);
  --spot: #1DB954; --scrim: rgba(8, 8, 8, .62); --float: 0 18px 48px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --wave: #94948D; --sheet-shadow: 0 4px 12px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, ul, figure { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.icon { flex: none; }

/* ---------- Shell ---------- */
.side, .rail { display: none; }
.main { min-width: 0; padding-bottom: 96px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  height: calc(64px + env(safe-area-inset-bottom, 0px)); padding: 0 4px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 48px; text-decoration: none; color: var(--ink2); font-size: 12px; font-weight: 500; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .icon { stroke-width: 2; }
.tabbar .write { justify-self: center; }

/* The one Write button: a plus and the word, never a pencil. */
.write { position: relative; }
.write-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 64px; min-height: 44px; padding: 0 16px;
  border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 600; cursor: pointer; }
.write-btn:hover { filter: brightness(1.08); }
.write-btn:active { transform: translateY(1px); }
.write-menu { position: absolute; z-index: 30; min-width: 220px; padding: 6px; background: var(--surface); border-radius: 12px; box-shadow: var(--float); } /* taste-skill-ignore: the Write menu floats */
.tabbar .write-menu { bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); }
.side .write-menu { top: calc(100% + 8px); left: 0; right: 0; }
.write-menu a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 15px; color: var(--ink); }
.write-menu a:hover, .write-menu a:focus-visible { background: var(--raised); }
.write-menu .icon { color: var(--ink2); }

/* Running head: the book's header line. It names the Era you are reading in once its band has scrolled away. */
.head { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
  height: 52px; padding: 0 8px; background: var(--page); }
.head .rh { grid-column: 2; max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 18px/1.2 var(--serif); }
.head .rh .mark { font-weight: 500; letter-spacing: -.01em; }
.head .back { grid-column: 1; justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--ink); max-width: 100%; }
.head .back span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .act { grid-column: 3; justify-self: end; }
/* Pages with a back link: no running head in the middle, so the back link takes the room it needs. */
.head.nav { grid-template-columns: minmax(0, 1fr) auto; }
.head.nav .act { grid-column: 2; }
.txtbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; border: 0; background: none; font-size: 14px; font-weight: 500; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; }
.txtbtn:hover { color: var(--ink); }

/* ---------- Feed ---------- */
.otd { display: flex; gap: 12px; align-items: center; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.otd::-webkit-scrollbar { display: none; }
.otd-label { flex: none; font-size: 13px; font-weight: 600; color: var(--ink); width: 44px; line-height: 1.25; }
.otd-item { flex: none; display: grid; grid-template-columns: 48px auto; gap: 10px; align-items: center; max-width: 236px; padding: 6px 12px 6px 6px; border-radius: 6px; background: var(--surface); text-decoration: none; }
.otd-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 3px; background: var(--raised); }
.otd-item b { display: block; font: 500 15px/1.25 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.otd-item small { font-size: 12px; color: var(--ink2); }

.eraband { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; margin: 0 16px; padding: 10px 14px 10px 10px;
  background: var(--cloth); color: var(--on-cloth); text-decoration: none; border-radius: 4px; }
.eraband img, .eraband .nocover { width: 64px; height: 64px; object-fit: cover; border-radius: 2px; }
.eraband img { background: rgba(255, 255, 255, .12); }
.eraband b { display: block; font: 400 21px/1.15 var(--serif); letter-spacing: -.005em; }
.eraband small { display: block; margin-top: 3px; font-size: 13px; color: var(--on-cloth2); }
.eraband .icon { color: var(--on-cloth2); }

.week { margin-top: 8px; }
.weekline { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 16px; border: 0; background: none; text-align: left; cursor: pointer; }
.weekline b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.weekline span { color: var(--ink2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.weekline .icon { margin-left: auto; color: var(--ink2); transition: transform .2s ease; }
.weekline[aria-expanded="true"] .icon { transform: rotate(90deg); }
.weeksum { margin: 0 16px 8px; padding: 14px 16px 16px; background: var(--surface); border-radius: 4px; }
.weeksum p { font: 400 17px/1.45 var(--serif); }
.weeksum .meta { margin-top: 4px; font-size: 13px; color: var(--ink2); }
.weeksum .thumbs { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.weeksum .thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 2px; flex: none; }

.entry { padding: 12px 0 28px; }
.mdate { padding: 0 16px; font-size: 13px; font-weight: 500; color: var(--ink2); }
.mdate .wd-long, .mdate .dm-split { display: none; }
.etitle { padding: 2px 16px 12px; font: 400 26px/1.15 var(--serif); letter-spacing: -.01em; }
.etitle a { text-decoration: none; }
.etitle a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.plates { display: grid; gap: 3px; }
.plates img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--raised); }
.plates .more { display: grid; gap: 3px; }
.plates .more.n2 { grid-template-columns: 1fr 1fr; }
.plates .more.n3 { grid-template-columns: 1fr 1fr 1fr; }
.plates .more img { aspect-ratio: 1; }
.plate-scan { margin: 0 16px; padding: 16px; background: var(--raised); border-radius: 2px; }
.plate-scan img { width: min(100%, 315px); aspect-ratio: 3 / 4; object-fit: contain; margin: 0 auto; } /* a diary page is portrait; the space is held before it loads so the feed never jumps */
.prose { padding: 14px 16px 0; font: 400 18px/1.55 var(--serif); }
.prose p + p, .prose p + ul, .prose ul + p { margin-top: .6em; }
.prose ul { padding-left: 1.2em; }
.prose li { margin: .15em 0; }
.prose h3 { margin: 1.1em 0 .25em; font: italic 400 17px/1.3 var(--serif); color: var(--ink2); }
.prose h3:first-child { margin-top: 0; }
.extras { display: grid; gap: 10px; padding: 14px 16px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px 0; list-style: none; }
.tags a, .tags button.tagadd { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 12px; border-radius: 999px; background: var(--raised); text-decoration: none; font-size: 13px; font-weight: 500; color: var(--ink2); border: 0; cursor: pointer; }
.tags a:hover { color: var(--ink); }

.voice { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 14px 6px 6px; background: var(--surface); border-radius: 999px; }
.play { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--ink); color: var(--page); cursor: pointer; }
.wave { width: 100%; height: 28px; color: var(--wave); }
.voice .dur { font-size: 13px; color: var(--ink2); }
.sound { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; padding: 4px 6px 4px 14px; background: var(--surface); border-radius: 999px; font-size: 14px; }
.sound .spot { color: var(--spot); display: flex; }
.sound span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sound b { font-weight: 600; }
.sound .txtbtn { min-height: 44px; }

.sealed { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; align-items: center; height: 120px; margin: 0 16px; padding: 12px 16px; overflow: hidden;
  background: var(--surface); border-radius: 4px; text-decoration: none; }
.sealed svg { width: 40px; height: 96px; }
.sealed .s-written { font-size: 13px; color: var(--ink2); }
.sealed .s-opens { display: block; margin-top: 2px; font: 400 17px/1.3 var(--serif); }
.sealed .s-count { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; color: var(--loot); }
.sealed:hover .s-opens { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.entry-sealed { padding-top: 4px; }

/* ---------- Entry page ---------- */
.ehead { padding: 8px 16px 14px; }
.ehead .mdate { padding: 0; }
.ehead h1 { margin-top: 4px; font: 400 28px/1.12 var(--serif); letter-spacing: -.015em; }
.figure img.hero { width: 100%; height: auto; background: var(--raised); }
.thumbs-row { display: flex; gap: 6px; padding: 8px 16px 0; }
.thumbs-row button { padding: 0; border: 2px solid transparent; border-radius: 3px; background: none; cursor: pointer; }
.thumbs-row button[aria-current="true"] { border-color: var(--ink); }
.thumbs-row img { width: 56px; height: 56px; object-fit: cover; border-radius: 1px; background: var(--raised); }
.entry-page .prose { padding-top: 22px; font-size: 19px; }
.details { display: grid; gap: 10px; padding: 24px 16px 0; }
.details h2 { font-size: 13px; font-weight: 600; color: var(--ink2); margin-top: 6px; }
.details .tags { padding: 0; }

/* ---------- Era page ---------- */
.era-cover img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--raised); }
.titlepage { padding: 24px 20px 24px; background: var(--cloth); color: var(--on-cloth); }
.titlepage h1 { font: 400 38px/1.05 var(--serif); letter-spacing: -.02em; }
.titlepage .when { margin-top: 10px; font-size: 14px; color: var(--on-cloth2); }
.titlepage blockquote { margin: 16px 0 0; font: italic 400 20px/1.4 var(--serif); }
.titlepage .sound { margin-top: 18px; background: rgba(255, 255, 255, .1); color: var(--on-cloth); }
.titlepage .sound .spot { color: #FFFFFF; }
.titlepage .sound .txtbtn { color: var(--on-cloth); }
.titlepage :focus-visible { outline-color: var(--on-cloth); } /* the accent ring would vanish on the bookcloth */
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 22px; }
.totals div { padding: 0 8px; }
.totals div:first-child { padding-left: 0; }
.totals div + div { border-left: 1px solid rgba(255, 255, 255, .22); }
.totals b { display: block; font: 500 24px/1.1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.totals small { font-size: 13px; color: var(--on-cloth2); white-space: nowrap; }
@media (max-width: 420px) { .totals div { padding: 0 6px; } .totals small { font-size: 12px; } }
.sect { padding: 24px 16px 0; }
.sect > h2 { font: 400 24px/1.2 var(--serif); margin-bottom: 8px; }
.leaders { list-style: none; margin: 0; padding: 0; }
.leaders li a { display: block; padding: 10px 0; text-decoration: none; min-height: 44px; }
.leaders .l-row { display: flex; align-items: baseline; gap: 8px; }
.leaders .l-title { font: 400 18px/1.3 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.leaders .l-dots { flex: 1; min-width: 16px; overflow: hidden; white-space: nowrap; color: var(--control); }
.leaders .l-dots::after { content: ". . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."; letter-spacing: .1em; }
.leaders .l-count { font-size: 14px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.leaders .l-sub { display: block; font-size: 13px; color: var(--ink2); margin-top: 1px; }
.leaders li a:hover .l-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.inside { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; list-style: none; padding: 0; margin: 0; }
.inside a { display: block; text-decoration: none; }
.inside img, .inside .nocover { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 2px; }
.inside img { background: var(--raised); }
.nocover { display: grid; place-items: center; background: var(--cloth); color: var(--on-cloth); font: 400 26px/1 var(--serif); }
.inside b { display: block; margin-top: 8px; font: 400 18px/1.25 var(--serif); }
.inside .tp { place-items: end start; padding: 14px; margin-bottom: 8px; }
.inside .tp b { margin: 0; font-size: 24px; line-height: 1.1; }
.inside li > a > small { display: block; }
.inside small { font-size: 13px; color: var(--ink2); }

/* ---------- Loot Drop: the sealed volume ---------- */
.loot { padding: 8px 16px 0; }
.stage { display: grid; place-items: center; padding: 12px 0 8px; }
.volume { position: relative; width: 196px; height: 318px; }
.vol-book { position: absolute; left: 0; top: 10px; width: 184px; height: 256px; }
/* the head of the page block, seen just above the cover, and the fore-edge at the right */
.vol-pages { position: absolute; top: -7px; left: 14px; right: -8px; height: 14px; background: var(--vol-pages); border-radius: 3px 3px 0 0; }
.vol-edge { position: absolute; top: 3px; right: -8px; width: 10px; bottom: 4px; background: var(--vol-pages); border-radius: 0 3px 3px 0; }
.vol-cover { position: absolute; inset: 0; background: var(--vol-cover); border-radius: 2px 4px 4px 2px; box-shadow: 0 26px 28px -20px var(--vol-shadow), 0 3px 0 var(--vol-shadow); } /* taste-skill-ignore: the Loot Drop volume rests on its own shadow (PLAN §7) */
.vol-cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 20px; background: var(--vol-spine); border-radius: 2px 0 0 2px; }
.vol-cover::after { content: ""; position: absolute; left: 34px; right: 14px; top: 22px; height: 3px; background: var(--vol-spine); box-shadow: 0 8px 0 -1px var(--vol-spine), 0 206px 0 var(--vol-spine), 0 198px 0 -1px var(--vol-spine); } /* taste-skill-ignore: stamped rules on the cover, drawn as offset copies */
/* the paper band printed with the day it opens, like the band round a new book */
.vol-band { position: absolute; left: -2px; right: -10px; top: 82px; padding: 14px 12px 14px 32px; background: var(--band); color: var(--band-ink); border-radius: 1px; }
.vol-band::before, .vol-band::after { content: ""; position: absolute; left: 32px; right: 14px; height: 2px; background: var(--ribbon); }
.vol-band::before { top: 7px; } .vol-band::after { bottom: 7px; }
.vol-band small { display: block; font-size: 12px; font-weight: 600; }
.vol-band b { display: block; margin-top: 1px; font: 500 22px/1.1 var(--serif); letter-spacing: -.01em; white-space: nowrap; }
.vol-band span { display: block; margin-top: 3px; font-size: 13px; }
.ribbon { position: absolute; left: 124px; top: 258px; width: 15px; height: 60px; background: var(--ribbon); transform-origin: 50% 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); }
@media (prefers-reduced-motion: no-preference) {
  .ribbon { animation: sway 2.6s cubic-bezier(.36, .07, .19, .97) .3s 1 both; }
  @keyframes sway { 0% { transform: rotate(0); } 18% { transform: rotate(9deg); } 40% { transform: rotate(-6deg); } 62% { transform: rotate(3deg); } 82% { transform: rotate(-1deg); } 100% { transform: rotate(0); } }
}
.loot-text h1 { margin-top: 14px; font: 400 28px/1.15 var(--serif); letter-spacing: -.01em; }
.countdown { margin-top: 4px; font: 400 44px/1.05 var(--serif); letter-spacing: -.02em; color: var(--loot); }
.written { margin-top: 10px; font-size: 14px; color: var(--ink2); }
.loot-text .note { margin-top: 14px; font: 400 18px/1.5 var(--serif); max-width: 34ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 20px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid var(--control); background: var(--surface); color: var(--ink); }
.btn:hover { border-color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }

/* ---------- Write ---------- */
.backdrop { display: none; }
.sheet { position: relative; min-height: 100vh; background: var(--surface); }
.w-head { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 60px; padding: 0 16px 0 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.w-head .w-h { justify-self: center; text-align: center; }
.w-head h1 { font: 400 18px/1.2 var(--serif); }
.w-head .saved { display: block; font-size: 12px; color: var(--ink2); }
.w-head .btn { justify-self: end; }
.w-head > .txtbtn { justify-self: start; }
.w-head .txtbtn { text-decoration: none; color: var(--ink); font-size: 15px; }
.w-body { padding: 0 0 32px; }
.w-main, .w-side { padding: 0 16px; }
.w-fields { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
.field-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 13px 0 11px; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); font-size: 14px; cursor: pointer; }
.field-btn small { color: var(--ink2); font-size: 13px; }
.field-btn .icon { color: var(--ink2); }
@media (max-width: 420px) { .w-fields { gap: 6px; } .field-btn { gap: 6px; padding: 0 10px 0 9px; } } /* date and template sit on one line on phones */
.w-title { display: block; width: 100%; margin-top: 14px; padding: 6px 0; border: 0; background: none; color: var(--ink); font: 400 24px/1.2 var(--serif); letter-spacing: -.01em; text-overflow: ellipsis; }
.w-title::placeholder { color: var(--ink2); }
.w-title:focus-visible { outline-offset: 4px; }
.fmtbar { position: sticky; top: 60px; z-index: 4; display: flex; gap: 2px; margin: 8px -8px 0; padding: 4px; background: var(--surface); }
.fmtbar button { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 8px; background: none; color: var(--ink2); cursor: pointer; font: 600 17px/1 var(--serif); }
.fmtbar button:hover, .fmtbar button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
.fmtbar .sep { width: 1px; margin: 10px 4px; background: var(--line); }
.w-text { padding: 6px 0 4px; font: 400 18px/1.55 var(--serif); }
.w-text:focus-visible { outline-offset: 6px; }
.w-text h3 { margin: 1em 0 .2em; font: italic 400 17px/1.3 var(--serif); color: var(--ink2); }
.w-text h3:first-child { margin-top: 0; }
.w-text ul { padding-left: 1.2em; margin: .3em 0; }
.w-text p { margin: .3em 0; }
.staging { display: flex; gap: 8px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; }
.staging img { width: 92px; height: 92px; object-fit: cover; border-radius: 3px; flex: none; background: var(--raised); }
.addtile { flex: none; display: grid; place-items: center; align-content: center; gap: 4px; width: 92px; height: 92px; border: 1px dashed var(--control); border-radius: 3px; background: none; color: var(--ink2); font-size: 13px; cursor: pointer; }
.w-main .voice { margin-top: 12px; background: var(--raised); }
.w-main .voice .play { background: var(--ink); color: var(--surface); }
.w-side h2 { margin: 22px 0 8px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.w-side .tags { padding: 0; }
.w-side .sound { background: var(--raised); }
.seal { margin-top: 24px; padding: 16px; background: var(--raised); border-radius: 6px; }
.seal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.seal-head h2 { margin: 0; font: 400 20px/1.2 var(--serif); color: var(--ink); }
.seal p { margin-top: 6px; font-size: 14px; color: var(--ink2); }
.quick { display: grid; gap: 6px; margin-top: 12px; }
.quick button { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; min-height: 48px; padding: 8px 14px; border: 1px solid var(--control); border-radius: 6px; background: var(--surface); text-align: left; cursor: pointer; }
.quick button:hover { border-color: var(--ink2); }
.quick button[aria-checked="true"] { border: 2px solid var(--accent); padding: 7px 13px; }
.quick button[aria-checked="true"] b::before { content: "\2713\00a0"; color: var(--accent); }
.quick b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.quick span { white-space: nowrap; }
.quick span { font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.mini-vol { width: 20px; height: 48px; flex: none; }

/* ---------- Laptop and tablet ---------- */
@media (min-width: 760px) {
  :root { --sidew: 200px; }
  .app { display: grid; grid-template-columns: var(--sidew) minmax(0, 1fr); min-height: 100vh; }
  .tabbar { display: none; }
  .main { padding-bottom: 64px; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; background: var(--side); }
  .side .wordmark { padding: 4px 10px 18px; font: 500 22px/1 var(--serif); letter-spacing: -.01em; text-decoration: none; }
  .side .write { margin-bottom: 18px; }
  .side .write-btn { width: 100%; justify-content: flex-start; padding: 0 16px; border-radius: 6px; }
  .navlink { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: 6px; text-decoration: none; font-size: 15px; color: var(--ink2); }
  .navlink:hover { color: var(--ink); background: var(--raised); }
  .navlink[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--raised); }
  .side .spacer { flex: 1; }
  .side .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; font-size: 14px; }
  .side .me i { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--cloth); color: var(--on-cloth); font: 400 15px/1 var(--serif); font-style: normal; }
  .side .me small { display: block; font-size: 12px; color: var(--ink2); }

  .head { height: 60px; padding: 0 32px; }
  .head .rh { max-width: 40vw; }
  .column { max-width: 760px; margin: 0 auto; padding: 0 32px; }
  .otd { padding: 4px 0 16px; }
  .eraband { margin: 0; grid-template-columns: 96px minmax(0, 1fr) auto; padding: 12px 20px 12px 12px; }
  .eraband img, .eraband .nocover { width: 96px; height: 72px; }
  .eraband b { font-size: 26px; }
  .weekline { padding: 0; min-height: 56px; }
  .weeksum { margin: 0 0 8px; }

  /* Dates in the margin: a 120px column beside the text, like a book's side notes. */
  .entry { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 28px; padding: 18px 0 40px; }
  .entry > .mdate { grid-row: 1 / span 9; padding: 6px 0 0; text-align: right; }
  .entry > * { grid-column: 2; }
  .entry > .mdate { grid-column: 1; }
  .mdate .wd-short, .mdate .dm-inline { display: none; }
  .mdate .wd-long { display: block; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .mdate .dm-split { display: block; font: 400 22px/1.15 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; }
  .etitle, .prose, .extras, .tags { padding-left: 0; padding-right: 0; }
  .etitle { font-size: 30px; }
  .plates img { border-radius: 1px; }
  .plate-scan { margin: 0; }
  .sealed { margin: 0; }

  .ehead, .thumbs-row, .details { padding-left: 0; padding-right: 0; }
  .loot { padding: 0; }
  .titlepage h1 { font-size: 44px; }
}

@media (min-width: 1180px) {
  :root { --sidew: 240px; }
  .side { padding: 26px 18px; }
  .wrap { display: grid; grid-template-columns: minmax(0, 720px) 300px; gap: 64px; justify-content: center; padding: 0 40px; }
  .wrap .column { max-width: none; margin: 0; padding: 0; }
  .wrap .otd { display: none; }
  .rail { display: block; position: sticky; top: 60px; align-self: start; padding-top: 4px; }
  .rail h2 { font: 400 22px/1.2 var(--serif); margin-bottom: 14px; }
  .rail-item { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; padding: 10px 0; text-decoration: none; }
  .rail-item img { width: 88px; height: 88px; object-fit: cover; border-radius: 2px; background: var(--raised); }
  .rail-item b { display: block; font: 400 18px/1.25 var(--serif); }
  .rail-item small { display: block; margin-top: 2px; font-size: 13px; color: var(--ink2); }
  .rail-item p { margin-top: 6px; font: 400 15px/1.45 var(--serif); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rail-item:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }

  /* Entry: text column with the date in the margin, details in the right rail; the plate stays under 56% of the screen. */
  .entry-page { display: grid; grid-template-columns: 112px minmax(0, 640px) 280px; column-gap: 28px; justify-content: center; padding: 8px 40px 0; }
  .entry-page .ehead { grid-column: 1 / 3; display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 28px; padding: 10px 0 18px; }
  .entry-page .ehead .mdate { padding-top: 10px; text-align: right; }
  .entry-page .ehead h1 { margin-top: 0; font-size: 34px; }
  .entry-page .figure { grid-column: 2; }
  .entry-page .figure img.hero { width: auto; max-width: 100%; max-height: 54vh; }
  .entry-page .thumbs-row { grid-column: 1; grid-row: 2; flex-direction: column; align-items: flex-end; padding: 0; }
  .entry-page .thumbs-row img { width: 64px; height: 64px; }
  .entry-page .prose { grid-column: 2; padding-top: 22px; }
  .entry-page .details { grid-column: 3; grid-row: 2 / span 3; align-self: start; position: sticky; top: 76px; padding: 0; }
  .entry-page .details h2:first-child { margin-top: 0; }

  .era-page { padding: 8px 40px 0; }
  .spread { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); max-width: 1100px; margin: 0 auto; }
  .spread .era-cover img { height: 100%; aspect-ratio: auto; min-height: 420px; }
  .titlepage { padding: 40px 40px 32px; display: flex; flex-direction: column; }
  .titlepage .sound { margin-top: 22px; }
  .titlepage .totals { margin-top: auto; padding-top: 24px; }
  .era-lower { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; max-width: 1100px; margin: 0 auto; }
  .era-lower .sect { padding: 28px 0 0; }

  .loot { padding: 0 40px; }
  .loot-page { display: grid; grid-template-columns: auto minmax(0, 420px); gap: 80px; align-items: center; justify-content: center; min-height: calc(100vh - 100px); padding-bottom: 40px; }
  .loot-page .stage { padding: 56px 104px 40px 96px; background: var(--surface); border-radius: 6px; }
  .loot-page .volume { zoom: 1.3; }
  .loot-text h1 { margin-top: 0; font-size: 32px; }
  .countdown { font-size: 46px; }
}
@media (min-width: 760px) and (max-width: 1179px) {
  .entry-page { max-width: 760px; margin: 0 auto; padding: 0 32px; }
  .entry-page .figure img.hero { max-height: 56vh; width: auto; max-width: 100%; }
  .entry-page .ehead .mdate .dm-inline { display: inline; }
  .entry-page .ehead .mdate .wd-long, .entry-page .ehead .mdate .dm-split { display: none; }
  .loot-page { max-width: 640px; margin: 0 auto; padding: 0 32px; }
}

/* Write on laptops: a dialog over the dimmed journal. */
@media (min-width: 760px) {
  .backdrop { display: block; }
  .write-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 32px 32px 32px calc(var(--sidew) + 32px); background: var(--scrim); }
  .sheet { min-height: 0; width: min(960px, 100%); max-height: calc(100vh - 64px); overflow: auto; border-radius: 10px; border: 1px solid var(--line); box-shadow: var(--sheet-shadow); } /* taste-skill-ignore: the Write dialog is a real overlay over the dimmed journal */
  .w-head { padding: 0 16px 0 10px; height: 64px; }
  .w-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 8px; padding: 0 0 28px; }
  .w-main { padding: 0 28px; }
  .w-side { padding: 0 24px 0 0; }
  .w-title { font-size: 28px; }
  .w-side .sound span { white-space: normal; line-height: 1.3; }
  .w-side .sound b, .w-side .sound .artist { display: block; }
  .w-side .sound .by { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../shared/content.js"></script>
<script src="../../shared/helpers.js"></script>
<script>
(function () {
  const { html, raw, icon } = M;
  const C = M.data;
  const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  const word = (n) => (n <= 10 ? WORDS[n] : n.toLocaleString('en-AU'));
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const plural = (n, one, many) => `${n.toLocaleString('en-AU')} ${n === 1 ? one : many}`;
  const svg = (inner, size = 20, sw = 1.6) => raw(`<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`);
  const LINES = '<path d="M5 7h14M5 12h14M5 17h9"/>';

  // ---------- Shared parts ----------
  let menuId = 0;
  function writeButton() {
    const id = `folio-write-${++menuId}`;
    return html`<div class="write">
      <button class="write-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}">${icon('plus', { size: 20, stroke: 2.2 })}<span>Write</span></button>
      <div class="write-menu" id="${id}" role="menu" hidden>
        <a role="menuitem" href="#write">${svg(LINES, 18)}New entry</a>
        <a role="menuitem" href="#write">${icon('image', { size: 18 })}Photo dump</a>
        <a role="menuitem" href="#write">${icon('page', { size: 18 })}Diary page</a>
      </div></div>`;
  }
  function side(active) {
    const link = (href, ic, label, key) => html`<a class="navlink" href="${href}" ${active === key ? raw('aria-current="page"') : ''}>${icon(ic, { size: 18 })}${label}</a>`;
    return html`<nav class="side" aria-label="Main">
      <a class="wordmark" href="#feed">memoirist</a>
      ${writeButton()}
      ${link('#feed', 'book', 'Journal', 'feed')}
      ${link('#feed', 'list', 'Timeline', 'timeline')}
      ${link('#era', 'layers', 'Eras', 'era')}
      ${link('#feed', 'page', 'Templates', 'templates')}
      <span class="spacer"></span>
      ${link('#feed', 'trash', 'Recently deleted', 'deleted')}
      <div class="me"><i aria-hidden="true">S</i><span>Sam<small>Melbourne</small></span></div>
    </nav>`;
  }
  function tabbar(active) {
    const tab = (href, ic, label, key) => html`<a class="tab" href="${href}" ${active === key ? raw('aria-current="page"') : ''}>${icon(ic, { size: 22 })}<span>${label}</span></a>`;
    return html`<nav class="tabbar" aria-label="Main">
      ${tab('#feed', 'book', 'Journal', 'feed')}
      ${tab('#feed', 'list', 'Timeline', 'timeline')}
      ${writeButton()}
      ${tab('#era', 'layers', 'Eras', 'era')}
      ${tab('#feed', 'user', 'You', 'you')}
    </nav>`;
  }
  const shell = (active, main) => html`<div class="app">${side(active)}<main class="main" id="main">${main}</main>${tabbar(active)}</div>`;

  function voice(m) {
    const bars = M.waveform(m.id, 44);
    const w = 3, gap = 2, W = bars.length * (w + gap);
    const rects = bars.map((h, i) => `<rect x="${i * (w + gap)}" y="${(1 - h) * 14}" width="${w}" height="${Math.max(2, h * 28)}" rx="1.5"/>`).join('');
    return html`<div class="voice">
      <button class="play" type="button" aria-label="${`Play voice note, ${M.duration(m.durationSeconds)}`}">${icon('play', { size: 18 })}</button>
      <svg class="wave" viewBox="0 0 ${W} 28" preserveAspectRatio="none" role="img" aria-label="${m.alt}" fill="currentColor">${raw(rects)}</svg>
      <span class="dur num">${M.duration(m.durationSeconds)}</span>
    </div>`;
  }
  function soundtrack(s, { action = 'Play' } = {}) {
    return html`<div class="sound">
      <span class="spot">${icon('spotify', { size: 22, label: 'Spotify' })}</span>
      <span><b>${s.title}</b><span class="by">, </span><span class="artist">${s.artist}</span></span>
      <button class="txtbtn" type="button">${action}</button>
    </div>`;
  }
  const tagList = (tags) => (tags.length ? html`<ul class="tags" aria-label="Tags">${tags.map((t) => html`<li><a href="#feed">${t.name}</a></li>`)}</ul>` : '');

  // The small volume for the sealed card: cover, spine, the paper band, the ribbon's tail. No words on it.
  const miniVolume = (cls = '') => raw(`<svg class="${cls}" viewBox="0 0 40 96" aria-hidden="true">
    <rect x="9" y="3" width="26" height="74" rx="1.5" style="fill:var(--vol-pages)"/>
    <rect x="4" y="2" width="28" height="76" rx="2" style="fill:var(--vol-cover)"/>
    <rect x="4" y="2" width="5" height="76" style="fill:var(--vol-spine)"/>
    <rect x="3" y="30" width="30" height="16" style="fill:var(--band)"/>
    <path d="M22 76h5v18l-2.5-3-2.5 3z" style="fill:var(--ribbon)"/></svg>`);

  // Margin date: folded above the title on phones, set in the margin on laptops. Shown once per day.
  const marginDate = (d) => html`<div class="mdate num"><span class="dm-inline">${M.date(d, 'day')}</span><span class="wd-long">${M.date(d, 'weekday')}</span><span class="dm-split">${M.date(d, 'dayMonth')}</span></div>`;

  // ---------- Feed ----------
  // The entry count is already on the week line above, so the summary says what else the week holds.
  function weekSentence(s) {
    const parts = [];
    if (s.photoCount) parts.push(`${word(s.photoCount)} photo${s.photoCount === 1 ? '' : 's'}`);
    if (s.voiceNoteCount) parts.push(`${word(s.voiceNoteCount)} voice note${s.voiceNoteCount === 1 ? '' : 's'}`);
    if (!parts.length) return null;
    const list = parts.length > 1 ? `${parts.slice(0, -1).join(', ')} and ${parts[parts.length - 1]}` : parts[0];
    return `${cap(list)}.`;
  }
  function weekBlock(w, era) {
    const s = M.weekStats(w);
    const id = `sum-${w.id}`;
    let lastDay = null;
    const entries = w.entries.map((e) => {
      const showDate = e.entryDate !== lastDay;
      lastDay = e.entryDate;
      return entryCard(e, showDate);
    });
    return html`<section class="week" aria-label="${M.weekLabel(w)}">
      <button class="weekline" type="button" aria-expanded="false" aria-controls="${id}">
        <b>${M.weekLabel(w)}</b><span class="num">${plural(s.entryCount, 'entry', 'entries')}</span>${icon('chevronRight', { size: 18 })}
      </button>
      <div class="weeksum" id="${id}" hidden>
        ${weekSentence(s) ? html`<p>${weekSentence(s)}</p>` : ''}
        <div class="meta num">${M.range(w.startDate, w.endDate)}${s.tags.length ? `, tagged ${s.tags.map((t) => t.name).join(', ')}` : ''}</div>
        <div class="thumbs">${s.thumbs.map((m) => html`<img src="${M.src(m)}" alt="${m.alt}">`)}</div>
      </div>
      ${entries}
    </section>`;
  }
  function plates(e) {
    const imgs = M.images(e);
    if (!imgs.length) return '';
    if (imgs[0].kind === 'PAGE_SCAN') return html`<figure class="plate-scan"><img src="${M.src(imgs[0])}" alt="${imgs[0].alt}"></figure>`;
    const rest = imgs.slice(1, 4);
    return html`<figure class="plates"><img src="${M.src(imgs[0])}" alt="${imgs[0].alt}">
      ${rest.length ? html`<div class="more n${rest.length}">${rest.map((m) => html`<img src="${M.src(m)}" alt="${m.alt}">`)}</div>` : ''}</figure>`;
  }
  function entryCard(e, showDate) {
    if (M.isSealed(e)) {
      const v = M.sealedView(e);
      return html`<article class="entry entry-sealed">
        ${showDate ? marginDate(v.memoryDate) : html`<div class="mdate"></div>`}
        <a class="sealed" href="#loot" data-sealed aria-label="${`Sealed Loot Drop. ${v.opens}, ${v.countdown}`}">
          ${miniVolume()}
          <span><span class="s-written">Written ${M.date(v.memoryDate, 'day')}</span>
          <span class="s-opens">${v.opens}</span>
          <span class="s-count">${v.countdown}</span></span>
        </a>
      </article>`;
    }
    const title = e.title || (!e.contentJson ? M.displayTitle(e) : null);
    return html`<article class="entry" data-entry="${e.id}">
      ${showDate ? marginDate(e.entryDate) : html`<div class="mdate"></div>`}
      ${title ? html`<h2 class="etitle"><a href="#entry">${title}</a></h2>` : ''}
      ${plates(e)}
      ${e.contentJson ? html`<div class="prose">${M.caption(e.contentJson)}</div>` : ''}
      ${M.voiceNotes(e).length || e.soundtrack ? html`<div class="extras">${M.voiceNotes(e).map(voice)}${e.soundtrack ? soundtrack(e.soundtrack) : ''}</div>` : ''}
      ${tagList(e.tags)}
    </article>`;
  }
  const otdRow = () => html`<div class="otd" role="list" aria-label="On this day">
    <span class="otd-label">On this day</span>
    ${C.onThisDay.map((e) => html`<a class="otd-item" role="listitem" href="#entry"><img src="${M.src(M.images(e)[0])}" alt=""><span><b>${M.displayTitle(e)}</b><small>${M.yearsAgo(e.entryDate)}</small></span></a>`)}
  </div>`;
  const otdRail = () => html`<aside class="rail" aria-labelledby="rail-otd"><h2 id="rail-otd">On this day</h2>
    ${C.onThisDay.map((e) => html`<a class="rail-item" href="#entry"><img src="${M.src(M.images(e)[0])}" alt="${M.images(e)[0].alt}"><span><b>${M.displayTitle(e)}</b><small>${M.yearsAgo(e.entryDate)}</small><p>${M.previewLine(e)}</p></span></a>`)}
  </aside>`;
  const eraBand = (era) => html`<a class="eraband" href="#era" data-era="${era.title}">
    ${M.cover(era) ? html`<img src="${M.cover(era)}" alt="">` : html`<span class="nocover" aria-hidden="true">${era.title[0]}</span>`}
    <span><b>${era.title}</b><small class="num">${M.range(era.startDate, era.endDate)}</small></span>${icon('chevronRight', { size: 18 })}</a>`;

  function feedColumn() {
    const groups = M.feedGroups();
    return html`<div class="column">
      ${otdRow()}
      ${groups.map((g) => html`${g.era ? eraBand(g.era) : ''}${g.weeks.map((w) => weekBlock(w, g.era))}`)}
    </div>`;
  }
  const runningHead = (quiet) => (quiet ? html`<header class="head"><p class="rh" data-rh></p></header>` : html`<header class="head"><h1 class="rh" data-rh></h1></header>`);
  const feedMain = (quiet) => html`${runningHead(quiet)}<div class="wrap">${feedColumn()}${otdRail()}</div>`;

  // ---------- Entry ----------
  function entryPage() {
    const e = M.featured.entry();
    const imgs = M.images(e);
    const week = M.weekOf(e.id);
    return html`<header class="head nav"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}<span>${M.weekLabel(week)}</span></a>
        <span class="act"><button class="txtbtn" type="button">Edit</button></span></header>
      <article class="entry-page">
        <header class="ehead"><div class="mdate num"><span class="dm-inline">${M.date(e.entryDate, 'long')}</span><span class="wd-long">${M.date(e.entryDate, 'weekday')}</span><span class="dm-split">${M.date(e.entryDate, 'dayMonth')}</span><span class="wd-long">${e.entryDate.slice(0, 4)}</span></div><h1>${e.title}</h1></header>
        <figure class="figure"><img class="hero" src="${M.src(imgs[0])}" alt="${imgs[0].alt}"></figure>
        <div class="thumbs-row" role="group" aria-label="${`Photos, ${imgs.length}`}">${imgs.map((m, i) => html`<button type="button" aria-current="${i === 0 ? 'true' : 'false'}" aria-label="${`Photo ${i + 1} of ${imgs.length}`}"><img src="${M.src(m)}" alt=""></button>`)}</div>
        <div class="prose">${M.caption(e.contentJson)}</div>
        <div class="details">
          <h2>Voice note</h2>${M.voiceNotes(e).map(voice)}
          <h2>Soundtrack</h2>${soundtrack(e.soundtrack)}
          <h2>Tags</h2>${tagList(e.tags)}
        </div>
      </article>`;
  }

  // ---------- Era ----------
  function eraMain() {
    const p = M.eraPage(C.featured.eraId);
    const era = p.era;
    const t = p.totals;
    const row = (r) => html`<li><a href="#feed"><span class="l-row"><span class="l-title">${r.title}</span><span class="l-dots" aria-hidden="true"></span><span class="l-count">${plural(r.entryCount, 'entry', 'entries')}</span></span>
      ${r.title !== M.range(r.startDate, r.endDate) ? html`<span class="l-sub num">${M.range(r.startDate, r.endDate)}</span>` : ''}</a></li>`;
    return html`<header class="head nav"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}<span>Eras</span></a><span class="act"><button class="txtbtn" type="button">Edit</button></span></header>
      <div class="era-page">
        <div class="spread">
          <figure class="era-cover"><img src="${M.cover(era)}" alt="A row of Victorian terrace houses with iron lace verandas in Fitzroy"></figure>
          <div class="titlepage">
            <h1>${era.title}</h1>
            <p class="when num">${M.range(era.startDate, era.endDate)}<br>${p.span} so far</p>
            <blockquote>${era.description}</blockquote>
            <div class="sound"><span class="spot">${icon('spotify', { size: 22, label: 'Spotify' })}</span><span><b>${era.soundtrack.title}</b>, ${era.soundtrack.artist}</span><button class="txtbtn" type="button">Play</button></div>
            <div class="totals num" role="list" aria-label="In this Era">
              <div role="listitem"><b>${t.weekCount.toLocaleString('en-AU')}</b><small>weeks</small></div>
              <div role="listitem"><b>${t.entryCount.toLocaleString('en-AU')}</b><small>entries</small></div>
              <div role="listitem"><b>${t.photoCount.toLocaleString('en-AU')}</b><small>photos</small></div>
              <div role="listitem"><b>${t.voiceNoteCount.toLocaleString('en-AU')}</b><small>voice notes</small></div>
            </div>
          </div>
        </div>
        <div class="era-lower">
          <div>
            <section class="sect" aria-labelledby="era-weeks"><h2 id="era-weeks">Weeks</h2>
              <ol class="leaders">${p.rows.map(row)}
                <li><a href="#feed"><span class="l-row"><span class="l-title">${plural(p.notListedWeeks, 'earlier week', 'earlier weeks')}</span><span class="l-dots" aria-hidden="true"></span><span class="l-count">${plural(C.eraPages[era.id].notListed.entryCount, 'entry', 'entries')}</span></span></a></li>
              </ol>
            </section>
          </div>
          <section class="sect" aria-labelledby="era-inside"><h2 id="era-inside">Eras inside this one</h2>
            <ul class="inside">${p.chaptersInside.map((x) => html`<li><a href="#feed">${M.cover(x) ? html`<img src="${M.cover(x)}" alt=""><b>${x.title}</b>` : html`<span class="nocover tp"><b>${x.title}</b></span>`}<small class="num">${M.range(x.startDate, x.endDate)}</small></a></li>`)}</ul>
          </section>
        </div>
      </div>`;
  }

  // ---------- Loot Drop ----------
  function lootMain() {
    const e = M.featured.lootDrop();
    const v = M.sealedView(e);
    const week = M.weekOf(e.id);
    return html`<header class="head nav"><a class="back" href="#feed">${icon('arrowLeft', { size: 20 })}<span>${M.weekLabel(week)}</span></a></header>
      <div class="loot"><div class="loot-page">
        <div class="stage">
          <div class="volume" role="img" aria-label="${`A sealed volume with a paper band: ${v.opens}`}">
            <div class="vol-book"><span class="vol-pages"></span><span class="vol-edge"></span><span class="vol-cover"></span>
              <div class="vol-band" aria-hidden="true"><small>Opens</small><b>${M.date(v.unlockDay, 'plain')}</b><span>${M.date(v.unlockDay, 'weekday')}, ${M.time(v.unlockAt)}</span></div>
            </div>
            <span class="ribbon" aria-hidden="true"></span>
          </div>
        </div>
        <div class="loot-text">
          <h1>Sealed Loot Drop</h1>
          <p class="countdown" data-countdown>${v.countdown}</p>
          <p class="written">Written ${M.date(v.memoryDate, 'long')}</p>
          <p class="note">Nobody can open it or change it before then, you included.</p>
          <div class="actions"><button class="btn" type="button">${icon('clock', { size: 18 })}Extend the seal</button><button class="txtbtn" type="button">Delete</button></div>
        </div>
      </div></div>`;
  }

  // ---------- Write ----------
  function writeSheet() {
    const d = M.draft();
    const e = d.entry;
    const tpl = M.template(e.templateId);
    const imgs = M.images(e);
    return html`<div class="write-layer"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="w-h1">
      <header class="w-head">
        <a class="txtbtn" href="#feed">Cancel</a>
        <div class="w-h"><h1 id="w-h1">New entry</h1><span class="saved" role="status">Draft saved ${M.time(d.savedAt)}</span></div>
        <button class="btn primary" type="button">Save</button>
      </header>
      <div class="w-body">
        <div class="w-main">
          <div class="w-fields">
            <button class="field-btn" type="button" aria-label="Memory date: today, Wednesday 28 October. Change">${icon('calendar', { size: 18 })}<span>Today, ${M.date(e.entryDate, 'day')}</span></button>
            <button class="field-btn" type="button" aria-label="${`Template: ${tpl.name}. Change`}">${icon('page', { size: 18 })}<span>${tpl.name} <small>template</small></span></button>
          </div>
          <label class="sr" for="w-title">Title (optional)</label>
          <input id="w-title" class="w-title" type="text" value="${e.title}" placeholder="Title (optional)">
          <div class="fmtbar" role="toolbar" aria-label="Formatting">
            <button type="button" aria-label="Bold" aria-pressed="false"><b>B</b></button>
            <button type="button" aria-label="Italic" aria-pressed="false"><i>I</i></button>
            <button type="button" aria-label="Heading" aria-pressed="false">H</button>
            <button type="button" aria-label="Bullet list" aria-pressed="false">${icon('list', { size: 20 })}</button>
            <span class="sep" aria-hidden="true"></span>
            <button type="button" aria-label="Add photos">${icon('image', { size: 20 })}</button>
            <button type="button" aria-label="Record a voice note">${icon('mic', { size: 20 })}</button>
          </div>
          <div class="w-text" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Entry text">${M.caption(e.contentJson)}</div>
          <div class="staging" role="list" aria-label="Photos">
            ${imgs.map((m) => html`<img role="listitem" src="${M.src(m)}" alt="${m.alt}">`)}
            <button class="addtile" type="button">${icon('plus', { size: 20 })}Add</button>
          </div>
          ${M.voiceNotes(e).map(voice)}
        </div>
        <div class="w-side">
          <h2>Tags</h2>
          <ul class="tags" aria-label="Tags">${e.tags.map((t) => html`<li><a href="#write">${t.name}</a></li>`)}<li><button class="tagadd" type="button">${icon('plus', { size: 14, stroke: 2 })}Add tag</button></li></ul>
          <h2>Soundtrack</h2>
          ${soundtrack(e.soundtrack, { action: 'Change' })}
          <section class="seal" aria-labelledby="seal-h">
            <div class="seal-head"><h2 id="seal-h">Seal as Loot Drop</h2></div>
            <p>Nobody, including you, can open it until the day you choose.</p>
            <div class="quick" role="radiogroup" aria-labelledby="seal-h">
              ${M.sealSuggestions().map((s) => html`<button type="button" role="radio" aria-checked="false"><b>${s.label}</b><span>${M.date(s.day, 'day')} ${s.day.slice(0, 4)}</span></button>`)}
            </div>
          </section>
        </div>
      </div>
    </section></div>`;
  }

  // ---------- Behaviour ----------
  function wire(screen) {
    document.querySelectorAll('.weekline').forEach((b) => b.addEventListener('click', () => {
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', String(open));
      document.getElementById(b.getAttribute('aria-controls')).hidden = !open;
    }));
    document.querySelectorAll('.quick button').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.quick button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    }));
    const thumbs = document.querySelectorAll('.thumbs-row button');
    thumbs.forEach((b, i) => b.addEventListener('click', () => {
      const hero = document.querySelector('img.hero');
      const m = M.images(M.featured.entry())[i];
      hero.src = M.src(m); hero.alt = m.alt;
      thumbs.forEach((x) => x.setAttribute('aria-current', String(x === b)));
    }));
    const rh = document.querySelector('[data-rh]');
    if (rh) {
      const bands = [...document.querySelectorAll('[data-era]')];
      const update = () => {
        const headH = document.querySelector('.head').getBoundingClientRect().height;
        const past = bands.filter((b) => b.getBoundingClientRect().bottom < headH);
        const name = past.length ? past[past.length - 1].dataset.era : null;
        const html0 = name ? M.esc(name) : (matchMedia('(min-width: 760px)').matches ? 'Journal' : '<span class="mark">memoirist</span>');
        if (rh.innerHTML !== html0) rh.innerHTML = html0;
      };
      window.onscroll = update;
      update();
    } else window.onscroll = null;
    if (screen === 'write') {
      const t = document.getElementById('w-title');
      if (t && matchMedia('(pointer: fine)').matches) t.focus({ preventScroll: true });
    }
  }

  function render(screen) {
    const app = document.getElementById('app');
    let out;
    if (screen === 'entry') out = shell('feed', entryPage());
    else if (screen === 'era') out = shell('era', eraMain());
    else if (screen === 'loot') out = shell('feed', lootMain());
    else if (screen === 'write') out = html`<div class="backdrop" inert aria-hidden="true">${shell('feed', feedMain(true))}</div>${writeSheet()}`;
    else out = shell('feed', feedMain());
    app.innerHTML = String(out);
    wire(screen);
  }
  M.mountApp(render);
})();
</script>
</body>
</html>
